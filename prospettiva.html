<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prospettiva — carta del tempo</title>
<style>
:root{
  --paper:#E7EDEE;
  --paper-2:#DDE6E7;
  --ink:#0D2B3A;
  --ink-soft:#4E656D;
  --rule:#B7C7CA;
  --rule-soft:#CBD8DA;
  --now:#B3216B;
  --lane:#D5E0E1;
  --future:#EFF3F3;

  --p1:#16606B; --p2:#98402F; --p3:#35407E; --p4:#9A7412; --p5:#4E656D; --p6:#6B3A6E;

  --display:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --data:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  --gutter:186px;
  --rowh:26px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--ui); font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}

/* ---------- head ---------- */
.head{
  display:flex; align-items:baseline; gap:18px; flex-wrap:wrap;
  padding:14px 18px 10px; border-bottom:1px solid var(--rule);
  background:var(--paper); position:relative; z-index:20;
}
.brand{font-family:var(--display); font-size:22px; letter-spacing:.01em}
.brand span{color:var(--now)}
.sub{font-family:var(--data); font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-soft)}
.spacer{flex:1}

nav.views{display:flex; gap:2px; border:1px solid var(--rule); border-radius:2px; overflow:hidden}
nav.views button{
  background:transparent; border:0; padding:6px 13px; cursor:pointer;
  font-size:12.5px; letter-spacing:.01em; color:var(--ink-soft);
}
nav.views button:hover{background:var(--paper-2)}
nav.views button[aria-selected="true"]{background:var(--ink); color:var(--paper)}
nav.views button:focus-visible{outline:2px solid var(--now); outline-offset:-2px}

.tools{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.tool{display:flex; align-items:center; gap:6px; font-family:var(--data); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft)}
.tool input[type=range]{width:104px; accent-color:var(--now)}
.btn{
  background:transparent; border:1px solid var(--rule); border-radius:2px;
  padding:5px 11px; cursor:pointer; font-size:12.5px;
}
.btn:hover{border-color:var(--ink); background:var(--paper-2)}
.btn:focus-visible{outline:2px solid var(--now); outline-offset:1px}
.btn.on{background:var(--ink); color:var(--paper); border-color:var(--ink)}

/* ---------- stage ---------- */
main{position:absolute; inset:0; top:var(--headh,58px); overflow:hidden}
.pane{position:absolute; inset:0; overflow:auto; display:none}
.pane.on{display:block}

/* ---------- chart ---------- */
.inner{position:relative; width:max-content; min-width:100%; padding-bottom:60px}
.grid{position:absolute; top:0; bottom:0; left:var(--gutter); pointer-events:none; z-index:0}
.gline{position:absolute; top:0; bottom:0; width:1px; background:var(--rule-soft)}
.gline.dec{background:var(--rule)}
.futurewash{position:absolute; top:0; bottom:0; background:
  repeating-linear-gradient(-45deg, rgba(13,43,58,.028) 0 2px, transparent 2px 7px);}
.meridian{position:absolute; top:0; bottom:0; width:1.5px; background:var(--now); z-index:6}
.meridian::before{
  content:attr(data-label); position:absolute; top:40px; left:5px;
  font-family:var(--data); font-size:9.5px; letter-spacing:.14em; color:var(--now);
  writing-mode:vertical-rl; text-transform:uppercase;
}

.axis{position:sticky; top:0; z-index:10; background:var(--paper); border-bottom:1px solid var(--ink); display:flex}
.axis .lab{
  position:absolute; bottom:3px; transform:translateX(-50%);
  font-family:var(--data); font-size:10.5px; letter-spacing:.05em; color:var(--ink-soft);
  white-space:nowrap;
}
.axis .tick{position:absolute; bottom:0; width:1px; height:5px; background:var(--rule)}
.axis .tick.dec{height:9px; background:var(--ink-soft)}
.axisrow{position:relative; height:34px; flex:1 0 auto}
.axishead{
  position:sticky; left:0; flex:0 0 var(--gutter); width:var(--gutter); height:34px;
  background:var(--paper); border-right:1px solid var(--rule); z-index:2;
  display:flex; align-items:flex-end; padding:0 10px 6px;
  font-family:var(--data); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft);
}

.person{position:relative; z-index:1}
.person + .person{border-top:1px solid var(--rule-soft)}
.prow{display:flex; align-items:stretch; min-height:var(--rowh)}
.plabel{
  position:sticky; left:0; z-index:5; flex:0 0 var(--gutter); width:var(--gutter);
  background:var(--paper); border-right:1px solid var(--rule);
  padding:4px 10px 4px 12px; display:flex; align-items:center; gap:7px;
}
.prow.head .plabel{padding-top:9px; padding-bottom:3px}
.swatch{flex:0 0 3px; align-self:stretch; margin:1px 0; border-radius:1px}
.pname{font-family:var(--display); font-size:15px; line-height:1.15}
.pmeta{font-family:var(--data); font-size:10px; color:var(--ink-soft); letter-spacing:.04em}
.tname{font-family:var(--data); font-size:9.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-soft)}
.track{position:relative; flex:1 0 auto; height:var(--rowh)}
.prow.head .track{height:24px}

.lifebar{
  position:absolute; top:50%; transform:translateY(-50%); height:5px; border-radius:3px;
  background:var(--lane);
}
.bar{
  position:absolute; top:3px; height:calc(var(--rowh) - 9px); border-radius:2px;
  background:currentColor; opacity:.16; border:1px solid currentColor;
  display:flex; align-items:center; overflow:visible; cursor:default;
}
.bar.open{border-right-style:dashed; -webkit-mask-image:linear-gradient(to right,#000 72%,rgba(0,0,0,.25));mask-image:linear-gradient(to right,#000 72%,rgba(0,0,0,.25))}
.bar.circa{border-style:dashed}
.barlab{
  position:absolute; left:6px; white-space:nowrap; font-size:11px; line-height:1;
  color:var(--ink); opacity:1; pointer-events:none;
}
.barwrap{position:absolute; top:0; height:var(--rowh); display:flex; align-items:center; cursor:default}
.mk{
  position:absolute; top:50%; width:9px; height:9px; margin:-4.5px 0 0 -4.5px;
  background:currentColor; transform:rotate(45deg); cursor:default;
}
.mk.soft{background:var(--paper); border:1.5px solid currentColor}
.mk.rec{width:7px;height:7px;margin:-3.5px 0 0 -3.5px; border-radius:50%; transform:none; background:var(--paper); border:1.5px solid currentColor}
.mklab{
  position:absolute; top:50%; transform:translateY(-50%); white-space:nowrap;
  font-size:11px; pointer-events:none; margin-left:9px; color:var(--ink);
}
.hit{position:absolute; top:0; height:var(--rowh); cursor:default}

.contextlane .plabel .pname{font-size:13px; font-style:italic}

/* ---------- tooltip ---------- */
#tip{
  position:fixed; z-index:60; pointer-events:none; opacity:0; transition:opacity .09s;
  background:var(--ink); color:var(--paper); border-radius:3px; padding:9px 11px;
  max-width:290px; box-shadow:0 6px 22px rgba(13,43,58,.28);
}
#tip.on{opacity:1}
#tip .t{font-family:var(--display); font-size:14px; margin-bottom:2px}
#tip .d{font-family:var(--data); font-size:10.5px; letter-spacing:.05em; color:#9FBAC2; margin-bottom:6px}
#tip .ages{display:grid; grid-template-columns:1fr auto; gap:1px 12px; font-size:11.5px; border-top:1px solid rgba(255,255,255,.18); padding-top:6px}
#tip .ages b{font-weight:500}
#tip .ages i{font-family:var(--data); font-style:normal; text-align:right; color:#CFE0E4}
#tip .note{font-size:11px; color:#9FBAC2; margin-top:5px}

/* ---------- text panes ---------- */
.wrap{max-width:1080px; margin:0 auto; padding:26px 22px 80px}
h2.sec{font-family:var(--display); font-size:19px; font-weight:500; margin:0 0 3px}
p.lede{color:var(--ink-soft); font-size:13px; margin:0 0 20px; max-width:64ch}

.year{border-top:1px solid var(--rule); padding:14px 0 16px; display:grid; grid-template-columns:120px 1fr; gap:20px}
.year:last-child{border-bottom:1px solid var(--rule)}
.ynum{font-family:var(--display); font-size:30px; line-height:1; letter-spacing:-.01em}
.ydist{font-family:var(--data); font-size:10.5px; color:var(--ink-soft); letter-spacing:.06em; margin-top:5px}
.ynum.past{color:var(--ink-soft)}
.ylist{display:flex; flex-direction:column; gap:7px}
.itm{display:flex; gap:9px; align-items:baseline}
.dot{flex:0 0 7px; height:7px; background:currentColor; transform:rotate(45deg); margin-top:5px}
.itxt{flex:1}
.iwhen{font-family:var(--data); font-size:10.5px; color:var(--ink-soft); letter-spacing:.04em}
.agestrip{font-family:var(--data); font-size:11px; color:var(--ink-soft); margin-top:3px}
.agestrip b{color:var(--ink); font-weight:500}

.nextup{margin:0 0 30px}
h3.subsec{font-family:var(--data); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-soft); font-weight:400; margin:0 0 10px; padding-bottom:6px; border-bottom:1px solid var(--ink)}
.nextgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(178px,1fr)); gap:16px 20px}
.nx{border-left:2px solid currentColor; padding-left:11px}
.nxdist{font-family:var(--data); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:currentColor}
.nxlab{font-family:var(--display); font-size:15px; line-height:1.2; margin:2px 0 1px}

table.mx{width:100%; border-collapse:collapse; font-size:13px}
table.mx th,table.mx td{padding:6px 10px; border-bottom:1px solid var(--rule-soft); text-align:left}
table.mx th{font-family:var(--data); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); border-bottom:1px solid var(--ink); position:sticky; top:0; background:var(--paper)}
table.mx td.n,table.mx th.n{text-align:right; font-family:var(--data); font-variant-numeric:tabular-nums}
table.mx td.when{font-family:var(--data); font-size:11.5px; color:var(--ink-soft); white-space:nowrap}
table.mx tr:hover td{background:var(--paper-2)}
.mxlab{display:flex; align-items:center; gap:7px}
.mxlab .dot{margin-top:0}

/* ---------- data drawer ---------- */
#drawer{
  position:absolute; inset:0; top:var(--headh,58px); background:var(--paper); z-index:30;
  display:none; grid-template-rows:auto 1fr auto;
}
#drawer.on{display:grid}
#drawer .dhead{padding:16px 22px 8px; max-width:1080px; margin:0 auto; width:100%}
#drawer textarea{
  width:100%; height:100%; resize:none; border:1px solid var(--rule); border-radius:2px;
  font-family:var(--data); font-size:12.5px; line-height:1.6; padding:12px 14px;
  background:#fff; color:var(--ink); tab-size:2;
}
#drawer .dbody{padding:0 22px; max-width:1080px; margin:0 auto; width:100%; min-height:0;
  display:flex; flex-direction:column}
#drawer .dfoot{padding:12px 22px 18px; max-width:1080px; margin:0 auto; width:100%; display:flex; gap:9px; align-items:center}
#msg{font-family:var(--data); font-size:11.5px; letter-spacing:.04em}
#msg.err{color:var(--now)}

.legend{display:none; flex-basis:100%; gap:14px; flex-wrap:wrap; align-items:center;
  font-family:var(--data); font-size:10px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-soft); padding:8px 0 2px; margin-top:8px; border-top:1px solid var(--rule-soft)}
.legend.on{display:flex}
.legend .hint{margin-left:auto; text-transform:none; letter-spacing:.02em; font-size:10.5px; opacity:.8}
.legend i{display:inline-block; width:9px; height:9px; background:currentColor; transform:rotate(45deg); margin-right:5px; vertical-align:-1px}
.legend .sq{transform:none; border-radius:1px; opacity:.4; border:1px solid currentColor}
.legend .ci{transform:none; border-radius:50%; background:transparent; border:1.5px solid currentColor}
.legend .ln{transform:none; width:2px; height:11px; background:var(--now); vertical-align:-2px}

#diags{max-height:34vh; overflow:auto; margin:0 0 12px; border:1px solid var(--rule); border-radius:2px; display:none}
#diags.on{display:block}
#diags .dg{display:grid; grid-template-columns:auto 1fr; gap:2px 10px; padding:9px 12px;
  border-bottom:1px solid var(--rule-soft); cursor:pointer; background:var(--paper)}
#diags .dg:last-child{border-bottom:0}
#diags .dg:hover{background:var(--paper-2)}
#diags .lv{font-family:var(--data); font-size:9.5px; letter-spacing:.1em; padding:2px 5px;
  border-radius:2px; align-self:start; margin-top:2px}
#diags .dg.error .lv{background:var(--now); color:var(--paper)}
#diags .dg.warning .lv{background:var(--paper-2); color:var(--ink-soft); border:1px solid var(--rule)}
#diags .ms{font-size:13.5px}
#diags .pt{grid-column:2; font-family:var(--data); font-size:10.5px; color:var(--ink-soft); letter-spacing:.03em}
#diags .hn{grid-column:2; font-size:12.5px; color:var(--ink-soft); margin-top:2px}
#diags .hd{padding:8px 12px; border-bottom:1px solid var(--ink); background:var(--paper-2);
  font-family:var(--data); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft)}
.btn.warn{border-color:var(--now); color:var(--now)}

.bar.doc{opacity:.10; border-style:dotted}
.bar.tiny{border-radius:1px; opacity:.42}
.filters{
  position:absolute; right:18px; z-index:40; min-width:216px;
  background:var(--paper); border:1px solid var(--ink); border-radius:2px;
  padding:12px 14px 13px; box-shadow:0 10px 30px rgba(13,43,58,.16); display:none;
}
.filters.on{display:block}
.filters h4{font-family:var(--data); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-soft); font-weight:400; margin:0 0 8px}
.filters label{display:flex; align-items:center; gap:8px; padding:3px 0; cursor:pointer; font-size:13px}
.filters label input{accent-color:var(--now); margin:0}
.filters label .c{width:9px; height:9px; border-radius:1px; opacity:.5; border:1px solid var(--ink-soft)}
.filters label.off{color:var(--ink-soft)}
.filters .fcount{margin-left:auto; font-family:var(--data); font-size:10.5px; color:var(--ink-soft)}
.filters .fbtns{display:flex; gap:6px; margin-top:10px; padding-top:9px; border-top:1px solid var(--rule-soft)}
.filters .fbtns button{flex:1; font-size:11.5px; padding:3px 6px}
.saved{font-family:var(--data); font-size:10.5px; letter-spacing:.05em; color:var(--ink-soft)}

/* ---------- carta dei luoghi ---------- */
.geo{position:absolute; inset:0; display:grid; grid-template-columns:1fr 302px}
.geomap{position:relative; overflow:hidden; background:#DFE9EA; cursor:grab}
.geomap.drag{cursor:grabbing}
.geomap svg{position:absolute; inset:0; width:100%; height:100%; display:block}
.coast{fill:none; stroke:#93AAAE; stroke-width:.9; vector-effect:non-scaling-stroke; stroke-linejoin:round}
.bord{fill:none; stroke:#B9CACC; stroke-width:.7; stroke-dasharray:3 3; vector-effect:non-scaling-stroke}
.trace{fill:none; stroke-width:1.6; opacity:.55; stroke-dasharray:5 4; vector-effect:non-scaling-stroke}
.pin{cursor:pointer}
.pin circle{stroke:var(--paper); stroke-width:1.6; transition:opacity .12s}
.pin text{font-family:var(--data); font-size:10.5px; fill:var(--ink); paint-order:stroke;
  stroke:rgba(223,233,234,.9); stroke-width:3px; pointer-events:none}
.pin.dim circle,.pin.dim text{opacity:.17}
.pin.sel circle{stroke:var(--now); stroke-width:2.4}
.geoctl{position:absolute; left:14px; top:14px; z-index:4; display:flex; flex-direction:column; gap:8px; align-items:flex-start}
.geoctl .btn{background:rgba(231,237,238,.94); backdrop-filter:blur(2px)}
.scrub{position:absolute; left:14px; right:14px; bottom:14px; z-index:4;
  background:rgba(231,237,238,.94); border:1px solid var(--rule); border-radius:2px; padding:9px 14px 7px}
.scrub .top{display:flex; align-items:baseline; gap:12px}
.scrubyear{font-family:var(--display); font-size:22px; line-height:1; min-width:66px}
.scrub input[type=range]{flex:1; accent-color:var(--now)}
.scrub .agestrip{margin-top:4px}
.geoside{border-left:1px solid var(--rule); overflow:auto; padding:16px 18px 40px}
.plc{border-top:1px solid var(--rule-soft); padding:10px 0; cursor:pointer}
.plc:first-of-type{border-top:1px solid var(--ink)}
.plc:hover,.plc.sel{background:var(--paper-2)}
.plc .pn{display:flex; align-items:baseline; gap:7px}
.plc .pn b{font-family:var(--display); font-size:15px; font-weight:500}
.plc .yrs{margin-left:auto; font-family:var(--data); font-size:11px; color:var(--ink-soft)}
.plc .src{font-family:var(--data); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft)}
.plc ul{margin:5px 0 0; padding:0; list-style:none}
.plc li{font-size:12.5px; display:flex; gap:8px}
.plc li span{font-family:var(--data); font-size:10.5px; color:var(--ink-soft); white-space:nowrap}
.nocoord{margin-top:22px; border-top:1px solid var(--rule); padding-top:12px}
.nocoord code{font-family:var(--data); font-size:11.5px; background:var(--paper-2); padding:1px 4px}
@media (max-width:860px){ .geo{grid-template-columns:1fr; grid-template-rows:1fr auto} .geoside{border-left:0; border-top:1px solid var(--rule); max-height:44%} }

@media (max-width:720px){
  :root{--gutter:126px}
  .brand{font-size:18px}
  .sub{display:none}
  .year{grid-template-columns:1fr; gap:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="head" id="head">
  <div class="brand">Prospettiva<span>.</span></div>
  <div class="sub" id="anchorline">—</div>
  <div class="spacer"></div>
  <nav class="views" role="tablist">
    <button role="tab" data-view="chart" aria-selected="true">Cronologia</button>
    <button role="tab" data-view="ages" aria-selected="false">Età allineate</button>
    <button role="tab" data-view="places" aria-selected="false">Luoghi</button>
    <button role="tab" data-view="dense" aria-selected="false">Anni densi</button>
    <button role="tab" data-view="matrix" aria-selected="false">Matrice</button>
  </nav>
  <div class="tools">
    <label class="tool">Scala <input type="range" id="zoom" min="6" max="120" step="1" value="26"></label>
    <button class="btn" id="btnNow">Oggi</button>
    <button class="btn" id="btnFilt">Filtri</button>
    <button class="btn" id="btnData">Dati</button>
  </div>
  <div class="legend on" id="legend">
    <span><i class="sq"></i>periodo</span>
    <span><i></i>evento</span>
    <span><i class="ci"></i>ricorrenza</span>
    <span style="opacity:.6"><i class="sq" style="border-style:dashed"></i>data incerta</span>
    <span><i class="ln"></i>oggi</span>
    <span class="hint">Passa sopra un elemento per leggere l'età di tutti in quel momento.</span>
  </div>
</header>

<div class="filters" id="filters"></div>

<main>
  <section class="pane on" id="pane-chart"></section>
  <section class="pane" id="pane-ages"></section>
  <section class="pane" id="pane-places"></section>
  <section class="pane" id="pane-dense"></section>
  <section class="pane" id="pane-matrix"></section>
</main>

<div id="drawer">
  <div class="dhead">
    <h2 class="sec">Dati</h2>
    <p class="lede">Incolla qui il tuo JSON e premi <b>Applica</b>. Niente esce da questa pagina: i dati restano in memoria finché la tieni aperta, quindi scarica il file prima di chiuderla.</p>
  </div>
  <div class="dbody"><div id="diags"></div><textarea id="json" spellcheck="false"></textarea></div>
  <div class="dfoot">
    <button class="btn" id="btnApply">Applica</button>
    <button class="btn" id="btnCheck">Controlla</button>
    <button class="btn" id="btnSave">Salva nel browser</button>
    <button class="btn" id="btnForget">Dimentica</button>
    <button class="btn" id="btnDownload">Scarica JSON</button>
    <button class="btn" id="btnUpload">Apri file…</button>
    <button class="btn" id="btnReset">Ripristina esempio</button>
    <button class="btn" id="btnClose">Chiudi</button>
    <span id="msg"></span>
    <input type="file" id="file" accept=".json,application/json" hidden>
  </div>
</div>

<div id="tip"></div>

<script>
"use strict";

/* =====================================================================
   1. DATI DI ESEMPIO
   ===================================================================== */
const SAMPLE = {
  version: 1,
  meta: { title: "Prospettiva famiglia", anchor: "marta" },
  settings: { ageDisplay: "midpoint", milestones: [5,10,20,25,50], horizon: "2060" },

  people: [
    {
      id:"marta", name:"Marta", role:"self", birth:"1977-03-09", color:"#16606B",
      documents:[
        {label:"Patente B", type:"patente", expires:"2029-03-09"},
        {label:"Passaporto", type:"passaporto", expires:"2030-06-14"},
        {label:"Carta d'identità", type:"identita", expires:"2032-01-20"}
      ],
      periods:[

/* =====================================================================
   2. DATE A PRECISIONE VARIABILE
   "1921" -> anno | "1998-11" -> mese | "2008-07-12" -> giorno
   Ogni data è un INTERVALLO [t0,t1) in anni decimali.
   ===================================================================== */
const MS_Y = 365.2425 * 86400000;

function decYear(d){
  const y = d.getUTCFullYear();
  const a = Date.UTC(y,0,1), b = Date.UTC(y+1,0,1);
  return y + (d.getTime()-a)/(b-a);
}
function ymd(y,m,d){ return decYear(new Date(Date.UTC(y, m-1, d))); }

function parseDate(s){
  if (s == null) return null;
  if (typeof s === "number") s = String(s);
  s = String(s).trim();
  let m;
  if ((m = /^(-?\d{1,4})$/.exec(s)))
    return mk(+m[1],1,1,"y", +m[1], +m[1]+1);
  if ((m = /^(-?\d{1,4})-(\d{1,2})$/.exec(s)))
    return mk(+m[1],+m[2],1,"m", ymd(+m[1],+m[2],1), ymd(+m[1],+m[2]+1,1));
  if ((m = /^(-?\d{1,4})-(\d{1,2})-(\d{1,2})$/.exec(s)))
    return mk(+m[1],+m[2],+m[3],"d", ymd(+m[1],+m[2],+m[3]), ymd(+m[1],+m[2],+m[3]+1));
  throw new Error('Data non riconosciuta: "'+s+'" (usa AAAA, AAAA-MM o AAAA-MM-GG)');
  function mk(y,mo,d,prec,t0,t1){ return {y,m:mo,d,prec,t0,t1,mid:(t0+t1)/2,raw:s}; }
}

const MONTHS = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
function fmtDate(dt){
  if (!dt) return "—";
  if (dt.prec === "y") return String(dt.y);
  if (dt.prec === "m") return MONTHS[dt.m-1] + " " + dt.y;
  return dt.d + " " + MONTHS[dt.m-1] + " " + dt.y;
}
function todayDec(){ return decYear(new Date()); }

/* =====================================================================
   3. SISTEMA SCOLASTICO ITALIANO
   Prima elementare a settembre dell'anno in cui si compiono 6 anni.
   ===================================================================== */
const STAGES = [
  {key:"primary",    label:"Elementari", a0:6,  a1:11, m1:6, },
  {key:"middle",     label:"Medie",      a0:11, a1:14, m1:6, endEvent:"Licenza media"},
  {key:"highschool", label:"Liceo",      a0:14, a1:19, m1:6, endEvent:"Maturità"},
  {key:"bachelor",   label:"Triennale",  a0:19, a1:22, m1:7, endEvent:"Laurea triennale"},
  {key:"master",     label:"Magistrale", a0:22, a1:24, m1:7, endEvent:"Laurea magistrale"}
];
const STAGE_IX = Object.fromEntries(STAGES.map((s,i)=>[s.key,i]));

function generateSchool(p, birth){
  const cfg = p.school; if (!cfg) return {periods:[], events:[]};
  const through = cfg.through || "highschool";
  const lastIx = STAGE_IX[through] != null ? STAGE_IX[through] : STAGE_IX.highschool;
  const shift = cfg.early ? -1 : 0;
  const delays = cfg.delays || {};
  const skip = new Set((p._replaced) || []);
  const periods = [], events = [];
  let cum = 0;
  for (let i=0;i<=lastIx;i++){
    const st = STAGES[i];
    const y0 = birth.y + st.a0 + shift + cum;
    cum += (delays[st.key] || 0);
    const y1 = birth.y + st.a1 + shift + cum;
    if (skip.has(st.key)) continue;
    periods.push({
      label: st.label, start: parseDate(y0+"-09"), end: parseDate(y1+"-0"+st.m1),
      track: "school", generated: true, key: st.key
    });
    if (st.endEvent)
      events.push({ label: st.endEvent, date: parseDate(y1+"-0"+st.m1), category:"school", generated:true });
  }
  return {periods, events};
}

/* =====================================================================
   3bis. SCADENZE DEI DOCUMENTI
   La patente italiana di categoria B si rinnova a intervalli che si
   accorciano con l'eta'; carta d'identita' e passaporto dipendono dall'eta'
   al rilascio. `validity` esplicito ha comunque la precedenza.
   ===================================================================== */
function docValidity(type, ageAtIssue){
  if (type === "patente")    return ageAtIssue < 50 ? 10 : ageAtIssue < 70 ? 5 : ageAtIssue < 80 ? 3 : 2;
  if (type === "passaporto" || type === "identita")
                             return ageAtIssue < 3 ? 3 : ageAtIssue < 18 ? 5 : 10;
  return null;
}
function generateDocs(p, birth, horizon){
  const out = [];
  for (const d of (p.documents||[])){
    if (!d.expires) throw new Error("Documento senza `expires`: "+(d.label||d.type||"?"));
    let exp = parseDate(d.expires);
    let guard = 0;
    while (guard++ < 40){
      const vGuess = d.validity || docValidity(d.type, Math.floor(exp.mid - birth.mid)) || 10;
      const from = parseDate(shiftYears(exp, -vGuess));
      out.push({ label: (d.label || d.type || "Documento"), start: from, end: exp,
                 track: "doc", generated: true, doc: d });
      if (exp.t0 > horizon) break;
      const ageAtIssue = Math.floor(exp.mid - birth.mid);
      const v = d.validity || docValidity(d.type, ageAtIssue) || 10;
      exp = parseDate(shiftYears(exp, v));
    }
  }
  return out;
}

/* =====================================================================
   4. NORMALIZZAZIONE
   ===================================================================== */
const TRACKS = [
  {k:"school",  l:"Scuola"},
  {k:"work",    l:"Lavoro"},
  {k:"home",    l:"Casa"},
  {k:"holiday", l:"Vacanze"},
  {k:"finance", l:"Denaro"},
  {k:"doc",     l:"Documenti"},
  {k:"life",    l:"Vita"},
  {k:"world",   l:"Contesto"}
];
const TRACK_LABEL = Object.fromEntries(TRACKS.map(t=>[t.k,t.l]));
const TRACK_ORDER = TRACKS.map(t=>t.k).filter(k=>k!=="world");
// I documenti ingombrano e non c'entrano con il resto: partono spenti.
const DEFAULT_OFF = ["doc"];
let FILT = null;
const on = tk => !FILT || FILT.has(tk || "life");

// A quale corsia appartiene un evento, ai fini dei filtri.
const CAT_TRACK = { school:"school", work:"work", home:"home", finance:"finance",
                    holiday:"holiday", doc:"doc", family:"life", sport:"life",
                    history:"world", life:"life" };
function evTrack(e){ return e.track || CAT_TRACK[e.category] || "life"; }
const PALETTE = ["#16606B","#98402F","#35407E","#9A7412","#4E656D","#6B3A6E"];

function placeName(pl){
  if (!pl) return null;
  return typeof pl === "string" ? pl : (pl.name || null);
}

function build(data){
  if (!data || !Array.isArray(data.people)) throw new Error("Manca l'elenco `people`.");
  const settings = Object.assign({ageDisplay:"midpoint", milestones:[5,10,20,25,50], horizon:"2060"}, data.settings||{});
  const horizon = parseDate(settings.horizon).t1;
  const now = todayDec();

  const people = data.people.map((p,i)=>{
    if (!p.birth) throw new Error("Persona senza `birth`: "+(p.name||p.id||"#"+i));
    const birth = parseDate(p.birth);
    const death = p.death ? parseDate(p.death) : null;
    const manual = (p.periods||[]).map(q=>normPeriod(q));
    p._replaced = manual.map(q=>q.replaces).filter(Boolean);
    const gen = generateSchool(p, birth);
    const docs = generateDocs(p, birth, horizon);
    const events = (p.events||[]).map(e=>normEvent(e)).concat(gen.events);
    return {
      id: p.id || ("p"+i), name: p.name || p.id || "?", role: p.role || "",
      birth, death, color: p.color || PALETTE[i % PALETTE.length],
      periods: manual.concat(gen.periods, docs), events,
      shared: [], sharedEvents: []
    };
  });
  const byId = Object.fromEntries(people.map(p=>[p.id,p]));

  // condivisi
  const rootEvents = (data.events||[]).map(e=>normEvent(e));
  const rootPeriods = (data.periods||[]).map(q=>normPeriod(q))
    .concat((data.holidays||[]).map(q=>Object.assign(normPeriod(q), {track:"holiday", category:"holiday"})));
  const context = [];
  for (const e of rootEvents){
    const who = (e.who||[]).map(id=>byId[id]).filter(Boolean);
    if (who.length){ e.shared = true; e.color = who[0].color; for (const p of who) p.sharedEvents.push(e); }
    else context.push(e);
  }
  const contextPeriods = [];
  for (const q of rootPeriods){
    const who = (q.who||[]).map(id=>byId[id]).filter(Boolean);
    if (who.length){ q.shared=true; q.color = who[0].color; who[0].shared.push(q); }
    else contextPeriods.push(q);
  }

  // ricorrenze
  for (const e of rootEvents.concat(...people.map(p=>p.events))){
    if (!e.recurrences) continue;
    const list = e.recurrences === true ? (settings.milestones||[]) : e.recurrences;
    e.recs = list.map(n=>({
      n, label: n+" anni — "+e.label,
      date: parseDate(shiftYears(e.date, n)), of: e
    })).filter(r=>r.date.t0 <= horizon);
  }

  // corsie per persona
  for (const p of people){
    const rows = [];
    for (const t of TRACK_ORDER){
      const items = p.periods.filter(q=>(q.track||"life")===t).concat(p.shared.filter(q=>(q.track||"finance")===t));
      if (!items.length) continue;
      if (t === "doc"){
        // un documento per riga: patente, passaporto e carta d'identita' si
        // sovrappongono nel tempo e su una corsia sola diventano illeggibili
        const byDoc = new Map();
        for (const q of items){
          if (!byDoc.has(q.label)) byDoc.set(q.label, []);
          byDoc.get(q.label).push(q);
        }
        for (const [label, list] of byDoc) rows.push({track:t, label, items:list});
      } else rows.push({track:t, items});
    }
    for (const r of rows) for (const q of r.items) q.tk = r.track;
    p.rows = rows;
    p.marks = [];
    for (const e of p.events) p.marks.push({kind:"event", e});
    for (const e of p.sharedEvents) p.marks.push({kind:"event", e});
    for (const e of p.events.concat(p.sharedEvents)) for (const r of (e.recs||[])) p.marks.push({kind:"rec", e:r});
    for (const m of p.marks) m.tk = evTrack(m.e.of || m.e);
    p.marks.sort((a,b)=>a.e.date.t0 - b.e.date.t0);
  }

  const placeDict = {};
  for (const [k,v] of Object.entries(data.places||{})){
    if (!Array.isArray(v) || v.length < 2 || typeof v[0] !== "number")
      throw new Error('Coordinate non valide per "'+k+'": servono [lat, lon].');
    placeDict[k] = [v[0], v[1]];
  }
  for (const p of (data.people||[])) for (const e of (p.events||[]).concat(p.periods||[]))
    if (e.place && typeof e.place === "object" && Array.isArray(e.place.coord)) placeDict[e.place.name] = e.place.coord;
  for (const e of (data.events||[]).concat(data.periods||[]))
    if (e.place && typeof e.place === "object" && Array.isArray(e.place.coord)) placeDict[e.place.name] = e.place.coord;

  const model = {settings, horizon, now, placeDict, context, contextPeriods, people, byId,
                 anchor: byId[(data.meta&&data.meta.anchor)||"me"] || people[0],
                 title: (data.meta&&data.meta.title) || "Prospettiva"};
  model.span = computeSpan(model);
  return model;

  function normEvent(e){
    if (!e.date) throw new Error("Evento senza `date`: "+(e.label||"?"));
    return Object.assign({}, e, {date: parseDate(e.date), placeName: placeName(e.place)});
  }
  function normPeriod(q){
    if (!q.start) throw new Error("Periodo senza `start`: "+(q.label||"?"));
    return Object.assign({}, q, {
      start: parseDate(q.start),
      end: q.end ? parseDate(q.end) : null,
      placeName: placeName(q.place)
    });
  }
}
function shiftYears(dt, n){
  if (dt.prec === "y") return String(dt.y+n);
  if (dt.prec === "m") return (dt.y+n)+"-"+String(dt.m).padStart(2,"0");
  return (dt.y+n)+"-"+String(dt.m).padStart(2,"0")+"-"+String(dt.d).padStart(2,"0");
}
function computeSpan(M){
  let lo = Infinity, hi = -Infinity;
  const touch = t => { if (t<lo) lo=t; if (t>hi) hi=t; };
  for (const p of M.people){
    touch(p.birth.t0);
    touch(p.death ? p.death.t1 : Math.min(M.horizon, Math.max(M.now, p.birth.t0+90)));
    for (const q of p.periods.concat(p.shared)){ touch(q.start.t0); touch(q.end?q.end.t1:M.now); }
    for (const m of p.marks) touch(m.e.date.t1);
  }
  for (const e of M.context) touch(e.date.t1);
  for (const q of M.contextPeriods){ touch(q.start.t0); touch(q.end?q.end.t1:M.now); }
  touch(M.now);
  return {lo: Math.floor(lo)-2, hi: Math.ceil(Math.min(hi, M.horizon))+2};
}

/* =====================================================================
   5. ETÀ
   ===================================================================== */
function ageRange(person, dt){
  const min = Math.floor(dt.t0 - person.birth.t1 + 1e-9);
  const max = Math.floor(dt.t1 - person.birth.t0 - 1e-9);
  const mid = Math.floor(dt.mid - person.birth.mid + 1e-9);
  return {min, max, mid};
}
function ageText(person, dt, mode){
  const a = ageRange(person, dt);
  if (a.max < 0) return {txt:"—", note:"non ancora nato"};
  if (person.death && dt.t0 >= person.death.t1) return {txt:"—", note:"non più in vita"};
  const fuzzy = a.min !== a.max;
  if (!fuzzy) return {txt: a.mid + " anni", note:null};
  if (mode === "range") return {txt: a.min+"–"+a.max+" anni", note:null};
  return {txt: "~" + a.mid + " anni", note:null};
}
function ageShort(person, dt, mode){
  const a = ageRange(person, dt);
  if (a.max < 0) return "–";
  if (person.death && dt.t0 >= person.death.t1) return "†";
  if (a.min === a.max) return String(a.mid);
  return mode === "range" ? a.min+"–"+a.max : "~"+a.mid;
}
function distText(t, now){
  const dy = t - now;
  const abs = Math.abs(dy);
  const years = Math.floor(abs);
  const months = Math.round((abs - years)*12);
  let s;
  if (abs < 1/24) return "adesso";
  if (years === 0) s = months + (months===1?" mese":" mesi");
  else if (months === 0 || years >= 8) s = Math.round(abs) + " anni";
  else s = years + (years===1?" anno":" anni") + " e " + months + (months===1?" mese":" mesi");
  return dy >= 0 ? "tra " + s : s + " fa";
}

let M = null, VIEW = "chart", PPY = 26;
const $ = s => document.querySelector(s);
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt!=null) n.textContent = txt; return n; };

function renderChart(pane, aligned){
  pane.innerHTML = "";
  const lo = aligned ? 0 : M.span.lo;
  const hi = aligned ? maxAge() : M.span.hi;
  const W = (hi-lo) * PPY;
  const X = t => (t - lo) * PPY;

  const inner = el("div","inner");
  inner.style.width = "calc(var(--gutter) + " + W + "px)";

  /* griglia */
  const grid = el("div","grid"); grid.style.width = W+"px";
  const step = PPY < 9 ? 10 : PPY < 22 ? 5 : 1;
  for (let y = Math.ceil(lo/step)*step; y <= hi; y += step){
    const g = el("div","gline" + (y%10===0?" dec":"")); g.style.left = X(y)+"px"; grid.appendChild(g);
  }
  if (!aligned){
    const fw = el("div","futurewash");
    fw.style.left = X(M.now)+"px"; fw.style.width = Math.max(0, W - X(M.now))+"px";
    grid.appendChild(fw);
    const mer = el("div","meridian"); mer.style.left = X(M.now)+"px";
    mer.dataset.label = "oggi";
    grid.appendChild(mer);
  }
  inner.appendChild(grid);

  /* asse */
  const axis = el("div","axis");
  const ah = el("div","axishead", aligned ? "Età" : "Anno");
  const ar = el("div","axisrow"); ar.style.width = W+"px";
  const lstep = PPY < 7 ? 20 : PPY < 14 ? 10 : PPY < 34 ? 5 : 1;
  for (let y = Math.ceil(lo/lstep)*lstep; y <= hi; y += lstep){
    const tk = el("div","tick"+(y%10===0?" dec":"")); tk.style.left = X(y)+"px"; ar.appendChild(tk);
    const lb = el("div","lab", String(y)); lb.style.left = X(y)+"px"; ar.appendChild(lb);
  }
  axis.appendChild(ah); axis.appendChild(ar);
  inner.appendChild(axis);

  /* persone */
  for (const p of M.people){
    const off = aligned ? -p.birth.mid : 0;
    const box = el("div","person");
    box.style.color = p.color;

    // riga intestazione + arco di vita + marker
    const head = el("div","prow head");
    const lab = el("div","plabel");
    const sw = el("div","swatch"); sw.style.background = p.color;
    const nm = el("div");
    nm.appendChild(el("div","pname", p.name));
    nm.appendChild(el("div","pmeta", (aligned ? roleIt(p.role) : fmtDate(p.birth) + (p.death? " – "+fmtDate(p.death):""))));
    lab.appendChild(sw); lab.appendChild(nm);
    const trk = el("div","track"); trk.style.width = W+"px";

    const lifeEnd = p.death ? p.death.mid : Math.min(M.horizon, Math.max(M.now, p.birth.mid));
    const lb0 = el("div","lifebar");
    lb0.style.left = X(p.birth.mid + off)+"px";
    lb0.style.width = Math.max(2,(lifeEnd - p.birth.mid) * PPY)+"px";
    lb0.style.background = p.color; lb0.style.opacity = .22;
    trk.appendChild(lb0);
    addTip(lb0, () => ({t:p.name, d: fmtDate(p.birth) + (p.death ? " – "+fmtDate(p.death) : ""), ages:null,
      note: p.death ? "Visse " + Math.floor(p.death.mid-p.birth.mid) + " anni." : "Oggi " + ageText(p, {t0:M.now,t1:M.now,mid:M.now}, M.settings.ageDisplay).txt + "."}));

    layoutMarks(p.marks.filter(m=>on(m.tk)), off, X, trk, W);
    head.appendChild(lab); head.appendChild(trk);
    box.appendChild(head);

    // corsie
    for (const row of p.rows.filter(r=>on(r.track))){
      const pr = el("div","prow");
      const l2 = el("div","plabel");
      l2.appendChild(el("div","swatch"));
      l2.appendChild(el("div","tname", row.label || TRACK_LABEL[row.track] || row.track));
      const t2 = el("div","track"); t2.style.width = W+"px";
      for (const q of row.items) t2.appendChild(bar(q, off, X, p));
      pr.appendChild(l2); pr.appendChild(t2);
      box.appendChild(pr);
    }
    inner.appendChild(box);
  }

  /* corsia di contesto */
  if (!aligned && on("world") && (M.context.length || M.contextPeriods.length)){
    const box = el("div","person contextlane");
    box.style.color = "#4E656D";
    const pr = el("div","prow head");
    const lab = el("div","plabel");
    lab.appendChild(el("div","swatch"));
    const nm = el("div"); nm.appendChild(el("div","pname","Il mondo intorno"));
    lab.appendChild(nm);
    const trk = el("div","track"); trk.style.width = W+"px";
    layoutMarks(M.context.map(e=>({kind:"event", e})), 0, X, trk, W);
    pr.appendChild(lab); pr.appendChild(trk);
    box.appendChild(pr);
    for (const q of M.contextPeriods){
      const r = el("div","prow");
      const l2 = el("div","plabel"); l2.appendChild(el("div","swatch"));
      l2.appendChild(el("div","tname", TRACK_LABEL[q.track]||"—"));
      const t2 = el("div","track"); t2.style.width = W+"px";
      t2.appendChild(bar(q, 0, X, null));
      r.appendChild(l2); r.appendChild(t2);
      box.appendChild(r);
    }
    inner.appendChild(box);
  }

  pane.appendChild(inner);
}

function roleIt(r){
  return {self:"io", partner:"compagna/o", child:"figlio/a", parent:"genitore",
          grandparent:"nonno/a", sibling:"fratello/sorella", friend:"amico/a"}[r] || r || "";
}
function maxAge(){
  let m = 0;
  for (const p of M.people){
    const end = p.death ? p.death.mid : Math.min(M.horizon, Math.max(M.now, p.birth.mid));
    m = Math.max(m, end - p.birth.mid);
    for (const q of p.periods.concat(p.shared)) m = Math.max(m, (q.end?q.end.t1:M.now) - p.birth.mid);
    for (const k of p.marks) m = Math.max(m, k.e.date.t1 - p.birth.mid);
  }
  return Math.ceil(m)+2;
}

function bar(q, off, X, owner){
  const t0 = q.start.mid + off;
  const t1 = (q.end ? q.end.mid : M.now) + off;
  const w0 = Math.max(3,(t1-t0)*PPY);
  const n = el("div","bar" + (q.end?"":" open") + (q.circa?" circa":"") +
               (q.tk==="doc"?" doc":"") + (w0 <= 4 ? " tiny" : ""));
  n.style.left = X(t0)+"px";
  n.style.width = w0+"px";
  const wrap = el("div","barwrap");
  wrap.style.left = X(t0)+"px";
  wrap.style.width = Math.max(3,(t1-t0)*PPY)+"px";
  const lb = el("div","barlab", q.tk === "doc" && q.end ? "scade " + fmtDate(q.end) : q.label);
  wrap.appendChild(lb);
  addTip(wrap, () => tipForSpan(q, owner));
  const frag = document.createDocumentFragment();
  frag.appendChild(n); frag.appendChild(wrap);
  const holder = el("div"); holder.style.display="contents"; holder.appendChild(frag);
  return holder;
}

// Le etichette compaiono solo se c'e' spazio prima del marker successivo:
// meglio niente che due scritte sovrapposte.
function layoutMarks(marks, off, X, trk, W){
  const xs = marks.map(m => X(m.e.date.mid + off));
  for (let i=0;i<marks.length;i++){
    const room = (i+1 < marks.length ? xs[i+1] : W) - xs[i];
    const txt = marks[i].e.label;
    const need = txt.length * 5.7 + 16;
    trk.appendChild(mark(marks[i], off, X, null, room >= need ? txt : null));
  }
}

function mark(m, off, X, owner, label){
  const isRec = m.kind === "rec";
  const dt = m.e.date;
  const x = X(dt.mid + off);
  const holder = el("div"); holder.style.display="contents";
  const n = el("div","mk" + (isRec?" rec":"") + (m.e.generated?" soft":""));
  n.style.left = x+"px";
  const hit = el("div","hit"); hit.style.left = (x-7)+"px"; hit.style.width = "14px";
  addTip(hit, () => tipForMoment(m.e, owner, isRec));
  holder.appendChild(n); holder.appendChild(hit);
  if (label){
    const lb = el("div","mklab", label);
    lb.style.left = x+"px";
    if (m.e.generated || isRec) lb.style.color = "var(--ink-soft)";
    holder.appendChild(lb);
  }
  return holder;
}

/* ---------- tooltip ---------- */
const tip = $("#tip");
function addTip(node, fn){
  node.addEventListener("mouseenter", ev => { showTip(fn(), ev); });
  node.addEventListener("mousemove", ev => { moveTip(ev); });
  node.addEventListener("mouseleave", () => { tip.classList.remove("on"); });
}
function showTip(o, ev){
  tip.innerHTML = "";
  tip.appendChild(el("div","t", o.t));
  if (o.d) tip.appendChild(el("div","d", o.d));
  if (o.ages && o.ages.length){
    const g = el("div","ages");
    for (const a of o.ages){ g.appendChild(el("b",null,a[0])); g.appendChild(el("i",null,a[1])); }
    tip.appendChild(g);
  }
  if (o.note) tip.appendChild(el("div","note", o.note));
  tip.classList.add("on");
  moveTip(ev);
}
function moveTip(ev){
  const r = tip.getBoundingClientRect();
  let x = ev.clientX + 14, y = ev.clientY + 16;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - 16;
  tip.style.left = Math.max(8,x)+"px"; tip.style.top = Math.max(8,y)+"px";
}
function agesAt(dt){
  const mode = M.settings.ageDisplay;
  return M.people.map(p => [p.name, ageShort(p, dt, mode)]);
}
function tipForMoment(e, owner, isRec){
  const d = fmtDate(e.date) + (e.circa || (e.of&&e.of.circa) ? " (circa)" : "");
  const place = e.placeName || (e.of && e.of.placeName);
  return {
    t: e.label,
    d: d + (place ? " · " + place : ""),
    ages: agesAt(e.date),
    note: distText(e.date.mid, M.now) + (isRec ? " · ricorrenza" : "")
  };
}
function tipForSpan(q, owner){
  const d = fmtDate(q.start) + " – " + (q.end ? fmtDate(q.end) : "in corso");
  const rows = [];
  const mode = M.settings.ageDisplay;
  for (const p of M.people){
    rows.push([p.name, ageShort(p, q.start, mode) + (q.end ? " → " + ageShort(p, q.end, mode) : "")]);
  }
  let note = "";
  if (q.end){
    note = q.end.t0 > M.now ? "Finisce " + distText(q.end.mid, M.now) + "." : "Durata " + Math.max(1,Math.round(q.end.mid-q.start.mid)) + " anni.";
  } else note = "Iniziato " + distText(q.start.mid, M.now) + ", ancora in corso.";
  return {t:q.label, d: d + (q.placeName ? " · " + q.placeName : ""), ages: rows, note};
}

/* =====================================================================
   7. ANNI DENSI
   ===================================================================== */
const ROUND_AGES = [18,20,30,40,50,60,65,70,80,90,100];

function collectMoments(){
  const out = [];
  const push = (dt, label, kind, color, who, detail) =>
    out.push({dt, label, kind, color: color||"#4E656D", who: who||null, detail: detail||null});

  for (const p of M.people){
    for (const e of p.events) if (on(evTrack(e))) push(e.date, e.label, e.generated?"school":"event", p.color, p, p.name);
    for (const e of p.events) if (on(evTrack(e))) for (const r of (e.recs||[])) push(r.date, r.label, "rec", p.color, p, p.name);
    for (const q of p.periods){
      if (!on(q.tk || q.track)) continue;
      push(q.start, "Inizio — "+q.label, "start", p.color, p, p.name);
      if (q.end) push(q.end, "Fine — "+q.label, "end", p.color, p, p.name);
    }
    for (const q of p.shared){
      if (!on(q.tk || q.track)) continue;
      push(q.start, "Inizio — "+q.label, "start", p.color, p, null);
      if (q.end) push(q.end, "Fine — "+q.label, "end", p.color, p, null);
    }
    for (const e of p.sharedEvents){
      if (!on(evTrack(e))) continue;
      push(e.date, e.label, "event", p.color, p, null);
      for (const r of (e.recs||[])) push(r.date, r.label, "rec", p.color, p, null);
    }
    // compleanni tondi
    for (const a of ROUND_AGES){
      const t = parseDate(shiftYears(p.birth, a));
      if (t.t0 > M.horizon) continue;
      if (p.death && t.t0 >= p.death.t1) continue;
      push(t, p.name + " compie " + a + " anni", "birthday", p.color, p, null);
    }
  }
  if (on("world")) for (const e of M.context) push(e.date, e.label, "world", "#4E656D", null, "il mondo");
  if (on("world")) for (const q of M.contextPeriods){
    push(q.start, "Inizio — "+q.label, "start", "#4E656D", null, null);
    if (q.end) push(q.end, "Fine — "+q.label, "end", "#4E656D", null, null);
  }
  // de-duplica le condivise (stesso label+anno)
  const seen = new Set(); const uniq = [];
  for (const m of out){
    const k = m.label + "|" + m.dt.raw;
    if (seen.has(k)) continue; seen.add(k); uniq.push(m);
  }
  uniq.sort((a,b)=>a.dt.t0-b.dt.t0);
  return uniq;
}

let densePast = false;
function renderDense(pane){
  pane.innerHTML = "";
  const wrap = el("div","wrap");
  const h = el("div"); 
  h.appendChild(el("h2","sec","Anni densi"));
  const l = el("p","lede");
  l.textContent = "Gli anni in cui si accavallano due o più cose. È qui che si vede la forma dei prossimi vent'anni: le maturità, la fine del mutuo, i compleanni tondi che cadono insieme.";
  h.appendChild(l);
  const tgl = el("button","btn" + (densePast?" on":""), densePast ? "Mostra solo dall'anno in corso" : "Includi anche il passato");
  tgl.onclick = () => { densePast = !densePast; renderDense(pane); };
  h.appendChild(tgl);
  wrap.appendChild(h);

  wrap.appendChild(nextUp());

  const moments = collectMoments();
  const nowY = new Date().getFullYear();
  const byYear = new Map();
  for (const m of moments){
    if (!densePast && m.dt.y < nowY) continue;
    if (!byYear.has(m.dt.y)) byYear.set(m.dt.y, []);
    byYear.get(m.dt.y).push(m);
  }
  const years = [...byYear.keys()].sort((a,b)=>a-b).filter(y => byYear.get(y).length >= 2);
  if (!years.length){
    wrap.appendChild(el("p","lede","Nessun anno con due o più eventi in questo intervallo."));
    pane.appendChild(wrap); return;
  }
  const list = el("div"); list.style.marginTop = "18px";
  for (const y of years){
    const row = el("div","year");
    const left = el("div");
    const yn = el("div","ynum" + (y<nowY?" past":""), String(y));
    left.appendChild(yn);
    left.appendChild(el("div","ydist", y===nowY ? "quest'anno" : distText(y+.5, M.now)));
    const ul = el("div","ylist");
    for (const m of byYear.get(y)){
      const it = el("div","itm"); it.style.color = m.color;
      it.appendChild(el("div","dot"));
      const tx = el("div","itxt");
      const line = el("div"); line.style.color = "var(--ink)";
      line.textContent = m.label;
      tx.appendChild(line);
      tx.appendChild(el("div","iwhen", fmtDate(m.dt) + (m.detail ? " · " + m.detail : "")));
      tx.appendChild(ageStrip(m.dt));
      it.appendChild(tx);
      ul.appendChild(it);
    }
    row.appendChild(left); row.appendChild(ul);
    list.appendChild(row);
  }
  wrap.appendChild(list);
  pane.appendChild(wrap);
}
// I prossimi sei passaggi, con la distanza da oggi: la risposta diretta
// a "quanto manca alla maturita' di ..." senza dover leggere il grafico.
function nextUp(){
  const box = el("div","nextup");
  const up = collectMoments()
    .filter(m => m.dt.t1 > M.now && m.kind !== "start")
    .slice(0, 6);
  if (!up.length) return box;
  box.appendChild(el("h3","subsec","Prossimi passaggi"));
  const g = el("div","nextgrid");
  for (const m of up){
    const c = el("div","nx"); c.style.color = m.color;
    c.appendChild(el("div","nxdist", distText(m.dt.mid, M.now)));
    const t = el("div","nxlab", m.label); t.style.color = "var(--ink)";
    c.appendChild(t);
    c.appendChild(el("div","iwhen", fmtDate(m.dt)));
    g.appendChild(c);
  }
  box.appendChild(g);
  return box;
}

function ageStrip(dt){
  const n = el("div","agestrip");
  const mode = M.settings.ageDisplay;
  const parts = M.people.map(p => {
    const s = ageShort(p, dt, mode);
    return p.name + " " + (s==="–" ? "—" : s);
  });
  n.innerHTML = parts.join("  ·  ");
  return n;
}

/* =====================================================================
   7bis. CARTA DEI LUOGHI
   Base cartografica incorporata: nessuna tile, nessuna rete.
   ===================================================================== */

function decodeLines(str){
  if (!str) return [];
  return str.split(";").map(seg=>{
    const pts=[]; let i=0, x=0, y=0;
    while (i<seg.length){
      let r=0,sh=0,b;
      do{ b=seg.charCodeAt(i++)-63; r|=(b&0x1f)<<sh; sh+=5; }while(b>=0x20);
      x += (r&1)?~(r>>1):(r>>1);
      r=0; sh=0;
      do{ b=seg.charCodeAt(i++)-63; r|=(b&0x1f)<<sh; sh+=5; }while(b>=0x20);
      y += (r&1)?~(r>>1):(r>>1);
      pts.push([x/1000, y/1000]);
    }
    return pts;
  });
}
