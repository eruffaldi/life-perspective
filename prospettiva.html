/* Ordine: coordinate esplicite > dizionario `places` > repertorio > nome contenuto nel testo. */
function resolvePlace(name, dict){
  if (!name) return null;
  if (dict && dict[name]) return {coord: dict[name], src: "dal tuo elenco"};
  if (GAZ[name]) return {coord: GAZ[name], src: "dal repertorio"};
  const keys = Object.keys(dict||{}).concat(Object.keys(GAZ));
  let best = null;
  for (const k of keys)
    if (name.length > k.length && name.indexOf(k) >= 0 && (!best || k.length > best.length)) best = k;
  if (best) return {coord: (dict&&dict[best]) || GAZ[best], src: "dedotto da " + best};
  return null;
}

function collectPlaces(){
  const dict = M.placeDict;
  const map = new Map();
  const add = (nm, entry) => {
    if (!nm) return;
    if (!map.has(nm)) map.set(nm, {name:nm, entries:[], years:0, people:new Set()});
    const P = map.get(nm);
    P.entries.push(entry);
    if (entry.person) P.people.add(entry.person);
    if (entry.t1 != null) P.years += Math.max(0, entry.t1 - entry.t0);
  };
  for (const p of M.people){
    for (const q of p.periods.concat(p.shared)) if (on(q.tk || q.track))
      add(q.placeName, {label:q.label, person:p, t0:q.start.mid, t1:(q.end?q.end.mid:M.now), open:!q.end,
                        when: fmtDate(q.start)+" – "+(q.end?fmtDate(q.end):"oggi"), span:q});
    for (const e of p.events.concat(p.sharedEvents)) if (on(evTrack(e)))
      add(e.placeName, {label:e.label, person:p, t0:e.date.t0, t1:null,
                        when: fmtDate(e.date), ev:e});
  }
  if (on("world")) for (const e of M.context)
    add(e.placeName, {label:e.label, person:null, t0:e.date.t0, t1:null, when: fmtDate(e.date), ev:e});
  if (on("world")) for (const q of M.contextPeriods)
    add(q.placeName, {label:q.label, person:null, t0:q.start.mid, t1:(q.end?q.end.mid:M.now), open:!q.end,
                      when: fmtDate(q.start)+" – "+(q.end?fmtDate(q.end):"oggi"), span:q});

  const placed = [], unplaced = [];
  for (const P of map.values()){
    const r = resolvePlace(P.name, dict);
    if (r){ P.coord = r.coord; P.src = r.src; placed.push(P); }
    else unplaced.push(P);
  }
  placed.sort((a,b)=> b.years - a.years || b.entries.length - a.entries.length);
  return {placed, unplaced};
}

/* Mercatore: y cresce verso nord, poi si ribalta in fase di disegno. */
function merc(lat, lon){
  const φ = Math.max(-85, Math.min(85, lat)) * Math.PI/180;
  return [lon, Math.log(Math.tan(Math.PI/4 + φ/2)) * 180/Math.PI];
}

let GEO = null;
function renderPlaces(pane){
  const {placed, unplaced} = collectPlaces();
  const keepYear = GEO && GEO.year;
  pane.innerHTML = "";
  const root = el("div","geo");
  const mapbox = el("div","geomap");
  const side = el("div","geoside");
  root.appendChild(mapbox); root.appendChild(side);
  pane.appendChild(root);

  if (!placed.length){
    side.appendChild(el("h2","sec","Nessun luogo posizionato"));
    const l = el("p","lede");
    l.textContent = "Aggiungi `place` a eventi e periodi. Per i nomi che il repertorio non conosce, indica le coordinate nel blocco `places`.";
    side.appendChild(l);
    if (unplaced.length) side.appendChild(unplacedBox(unplaced));
    return;
  }

  /* proiezione e inquadratura */
  const pts = placed.map(P => merc(P.coord[0], P.coord[1]));
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for (const [x,y] of pts){ x0=Math.min(x0,x); x1=Math.max(x1,x); y0=Math.min(y0,y); y1=Math.max(y1,y); }
  const MINSPAN = 1.6;
  if (x1-x0 < MINSPAN){ const c=(x0+x1)/2; x0=c-MINSPAN/2; x1=c+MINSPAN/2; }
  if (y1-y0 < MINSPAN){ const c=(y0+y1)/2; y0=c-MINSPAN/2; y1=c+MINSPAN/2; }
  const padx=(x1-x0)*0.16, pady=(y1-y0)*0.16;
  const home = {x0:x0-padx, x1:x1+padx, y0:y0-pady, y1:y1+pady};

  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS,"svg");
  const gWorld = document.createElementNS(svgNS,"g");
  const gPins = document.createElementNS(svgNS,"g");
  svg.appendChild(gWorld); svg.appendChild(gPins);
  mapbox.appendChild(svg);

  /* dettaglio fine dentro il Mediterraneo, altrimenti la carta generale */
  const bb = COAST.euro.bbox;
  const inEuro = home.x0 > bb[0] && home.x1 < bb[2] &&
                 home.y0 > merc(bb[1],0)[1] && home.y1 < merc(bb[3],0)[1];
  const layer = inEuro ? COAST.euro : COAST.world;
  for (const [key, cls] of [["all","coast"],["border","bord"]]){
    for (const line of decodeLines(layer[key])){
      const path = document.createElementNS(svgNS,"path");
      let d = "";
      for (let i=0;i<line.length;i++){
        const [x,y] = merc(line[i][1], line[i][0]);
        d += (i?"L":"M") + x.toFixed(3) + " " + (-y).toFixed(3);
      }
      path.setAttribute("d", d); path.setAttribute("class", cls);
      gWorld.appendChild(path);
    }
  }

  /* tracce: gli spostamenti di casa, in ordine */
  const traces = [];
  for (const p of M.people){
    const homes = p.periods.filter(q => q.track === "home" && q.placeName)
      .map(q => ({q, P: placed.find(z => z.name === q.placeName)}))
      .filter(z => z.P).sort((a,b)=>a.q.start.t0 - b.q.start.t0);
    if (homes.length >= 2) traces.push({p, homes});
  }
  const gTrace = document.createElementNS(svgNS,"g");
  gWorld.appendChild(gTrace);

  /* stato vista */
  const st = { k:1, tx:0, ty:0, year: keepYear || Math.round(M.now), sel:null, showTrace:true };

  function fit(){
    const w = mapbox.clientWidth || 800, h = mapbox.clientHeight || 600;
    const sx = w/(home.x1-home.x0), sy = h/(home.y1-home.y0);
    st.base = Math.min(sx, sy);
    st.bx = w/2 - st.base*(home.x0+home.x1)/2;
    st.by = h/2 + st.base*(home.y0+home.y1)/2;
    st.k = 1; st.tx = 0; st.ty = 0;
  }
  const px = P => {
    const [x,y] = merc(P.coord[0], P.coord[1]);
    return [ (st.base*x + st.bx)*st.k + st.tx, (-st.base*y + st.by)*st.k + st.ty ];
  };
  function apply(){
    gWorld.setAttribute("transform",
      "translate("+st.tx+","+st.ty+") scale("+st.k+") translate("+st.bx+","+st.by+") scale("+st.base+")");
    drawPins(); drawTrace();
  }

  /* pin */
  const pinNodes = new Map();
  const maxYears = Math.max(1, ...placed.map(P=>P.years));
  function radius(P){ return 5 + 11 * Math.sqrt(P.years / maxYears); }
  function buildPins(){
    gPins.textContent = "";
    for (const P of placed){
      const g = document.createElementNS(svgNS,"g"); g.setAttribute("class","pin");
      const c = document.createElementNS(svgNS,"circle");
      const owner = [...P.people][0];
      c.setAttribute("fill", owner ? owner.color : "#4E656D");
      c.setAttribute("fill-opacity", .78);
      c.setAttribute("r", radius(P).toFixed(1));
      const t = document.createElementNS(svgNS,"text");
      t.textContent = P.name;
      t.setAttribute("dx", (radius(P)+5).toFixed(1)); t.setAttribute("dy", "3.5");
      g.appendChild(c); g.appendChild(t);
      addTip(g, () => tipForPlace(P));
      g.addEventListener("click", () => { st.sel = (st.sel===P?null:P); drawPins(); paintSide(); });
      gPins.appendChild(g);
      pinNodes.set(P, g);
    }
  }
  function activeAt(P, y){
    return P.entries.some(e => {
      if (e.t1 == null) return Math.floor(e.t0) === y;      // evento puntuale
      if (e.t0 > y+1) return false;                          // non ancora cominciato
      return e.open || e.t1 >= y;                            // "in corso" non scade oggi
    });
  }
  // Le etichette si nascondono quando si sovrappongono: vince il cerchio piu'
  // grande, e il luogo selezionato ha sempre la precedenza. Zoomando ricompaiono.
  function drawPins(){
    const boxes = [];
    const order = placed.slice().sort((a,b)=>
      (b===st.sel) - (a===st.sel) || radius(b) - radius(a));
    const shown = new Set();
    for (const P of order){
      const [x,y] = px(P);
      const r = radius(P);
      const w = P.name.length * 6.1 + 4, h = 13;
      const bx = x + r + 5, by = y - h/2;
      const clash = boxes.some(b => bx < b[2] && bx+w > b[0] && by < b[3] && by+h > b[1]);
      if (!clash){ boxes.push([bx, by, bx+w, by+h]); shown.add(P); }
    }
    for (const P of placed){
      const g = pinNodes.get(P);
      const [x,y] = px(P);
      g.setAttribute("transform","translate("+x.toFixed(1)+","+y.toFixed(1)+")");
      g.classList.toggle("dim", !activeAt(P, st.year));
      g.classList.toggle("sel", st.sel === P);
      g.querySelector("text").style.display = shown.has(P) ? "" : "none";
    }
  }
  function drawTrace(){
    gTrace.textContent = "";
    if (!st.showTrace) return;
    for (const tr of traces){
      const path = document.createElementNS(svgNS,"path");
      let d = "";
      tr.homes.forEach((z,i)=>{
        const [x,y] = merc(z.P.coord[0], z.P.coord[1]);
        d += (i?"L":"M") + x.toFixed(3) + " " + (-y).toFixed(3);
      });
      path.setAttribute("d", d); path.setAttribute("class","trace");
      path.setAttribute("stroke", tr.p.color);
      gTrace.appendChild(path);
    }
  }

  /* interazione */
  let drag = null;
  mapbox.addEventListener("mousedown", e => { drag = {x:e.clientX, y:e.clientY, tx:st.tx, ty:st.ty}; mapbox.classList.add("drag"); });
  addEventListener("mouseup", () => { drag = null; mapbox.classList.remove("drag"); });
  addEventListener("mousemove", e => {
    if (!drag) return;
    st.tx = drag.tx + (e.clientX-drag.x); st.ty = drag.ty + (e.clientY-drag.y); apply();
  });
  mapbox.addEventListener("wheel", e => {
    e.preventDefault();
    const r = mapbox.getBoundingClientRect();
    const mx = e.clientX-r.left, my = e.clientY-r.top;
    const f = Math.exp(-e.deltaY * 0.0016);
    const k2 = Math.max(0.4, Math.min(400, st.k*f));
    const g = k2/st.k;
    st.tx = mx - g*(mx - st.tx); st.ty = my - g*(my - st.ty); st.k = k2;
    apply();
  }, {passive:false});

  /* controlli */
  const ctl = el("div","geoctl");
  const bFit = el("button","btn","Inquadra tutto");
  bFit.onclick = () => { fit(); apply(); };
  const bTr = el("button","btn on","Traccia dei traslochi");
  bTr.onclick = () => { st.showTrace = !st.showTrace; bTr.classList.toggle("on", st.showTrace); drawTrace(); };
  ctl.appendChild(bFit); if (traces.length) ctl.appendChild(bTr);
  mapbox.appendChild(ctl);

  /* cursore degli anni */
  const scrub = el("div","scrub");
  const top = el("div","top");
  const yl = el("div","scrubyear", String(st.year));
  const rng = document.createElement("input");
  rng.type = "range"; rng.min = String(M.span.lo); rng.max = String(Math.ceil(M.horizon)); rng.step = "1";
  rng.value = String(st.year);
  const bNow = el("button","btn","Oggi");
  top.appendChild(yl); top.appendChild(rng); top.appendChild(bNow);
  let strip = ageStrip(parseDate(String(st.year)));
  scrub.appendChild(top); scrub.appendChild(strip);
  rng.oninput = () => {
    st.year = +rng.value; yl.textContent = rng.value;
    strip.replaceWith(strip = ageStrip(parseDate(String(st.year))));
    drawPins();
  };
  bNow.onclick = () => { rng.value = String(Math.round(M.now)); rng.oninput(); };
  mapbox.appendChild(scrub);

  /* elenco laterale */
  function paintSide(){
    side.textContent = "";
    side.appendChild(el("h2","sec","Luoghi"));
    const l = el("p","lede");
    l.textContent = "Il cerchio cresce con gli anni passati sul posto. Il cursore in basso spegne i luoghi che in quell'anno non c'entravano.";
    side.appendChild(l);
    for (const P of placed){
      const b = el("div","plc" + (st.sel===P?" sel":""));
      const nm = el("div","pn");
      const dot = el("span"); dot.style.cssText = "width:9px;height:9px;border-radius:50%;background:"+
        ([...P.people][0] ? [...P.people][0].color : "#4E656D");
      nm.appendChild(dot);
      nm.appendChild(el("b",null,P.name));
      if (P.years >= 0.5) nm.appendChild(el("div","yrs", Math.round(P.years)+" anni"));
      b.appendChild(nm);
      b.appendChild(el("div","src", P.src));
      const ul = el("ul");
      for (const e of P.entries.slice().sort((a,b)=>a.t0-b.t0)){
        const li = el("li");
        li.appendChild(el("div",null,(e.person? e.person.name+" — ":"")+e.label));
        li.appendChild(el("span",null,e.when));
        ul.appendChild(li);
      }
      b.appendChild(ul);
      b.onclick = () => { st.sel = (st.sel===P?null:P); drawPins(); paintSide(); };
      side.appendChild(b);
    }
    if (unplaced.length) side.appendChild(unplacedBox(unplaced));
  }

  buildPins(); paintSide();
  fit(); apply();
  requestAnimationFrame(()=>{ fit(); apply(); });
  GEO = st;
}

function unplacedBox(list){
  const b = el("div","nocoord");
  b.appendChild(el("h3","subsec","Senza coordinate"));
  const p = el("p","lede");
  p.style.marginBottom = "8px";
  p.textContent = "Questi nomi non sono nel repertorio. Aggiungili al blocco `places` in fondo al JSON:";
  b.appendChild(p);
  const pre = el("div");
  pre.style.cssText = "font-family:var(--data);font-size:11.5px;line-height:1.7";
  pre.appendChild(el("div",null,'"places": {'));
  for (const P of list){
    const c = el("code", null, '  "'+P.name+'": [41.90, 12.50]');
    const row = el("div"); row.appendChild(c); pre.appendChild(row);
  }
  pre.appendChild(el("div",null,"}"));
  b.appendChild(pre);
  return b;
}

function tipForPlace(P){
  const rows = P.entries.slice().sort((a,b)=>a.t0-b.t0).slice(0,7)
    .map(e => [(e.person? e.person.name+" — ":"")+e.label, e.when]);
  const note = P.years >= 0.5
    ? Math.round(P.years) + " anni complessivi qui."
    : P.entries.length + (P.entries.length===1 ? " momento." : " momenti.");
  return {t: P.name, d: P.coord[0].toFixed(3)+", "+P.coord[1].toFixed(3)+" · "+P.src, ages: rows, note};
}

/* =====================================================================
   8. MATRICE
   ===================================================================== */
function renderMatrix(pane){
  pane.innerHTML = "";
  const wrap = el("div","wrap");
  wrap.appendChild(el("h2","sec","Matrice delle età"));
  const l = el("p","lede");
  l.textContent = "Ogni riga è un momento, ogni colonna una persona: la cella dice quanti anni aveva o avrà. Il trattino segna chi non era ancora nato, la croce chi non c'era più.";
  wrap.appendChild(l);

  const moments = collectMoments().filter(m => m.kind !== "birthday");
  const tbl = el("table","mx");
  const thead = el("thead"); const tr = el("tr");
  tr.appendChild(el("th",null,"Momento"));
  tr.appendChild(el("th",null,"Quando"));
  for (const p of M.people) tr.appendChild(el("th","n", p.name));
  thead.appendChild(tr); tbl.appendChild(thead);
  const tb = el("tbody");
  const mode = M.settings.ageDisplay;
  for (const m of moments){
    const r = el("tr");
    const c0 = el("td");
    const lb = el("div","mxlab");
    const d = el("div","dot"); d.style.color = m.color; d.style.flex = "0 0 7px";
    lb.appendChild(d); lb.appendChild(el("span",null,m.label));
    c0.appendChild(lb);
    r.appendChild(c0);
    r.appendChild(el("td","when", fmtDate(m.dt)));
    for (const p of M.people){
      const c = el("td","n", ageShort(p, m.dt, mode));
      if (c.textContent === "–" || c.textContent === "†") c.style.color = "var(--rule)";
      r.appendChild(c);
    }
    tb.appendChild(r);
  }
  tbl.appendChild(tb);
  wrap.appendChild(tbl);
  pane.appendChild(wrap);
}


/* =====================================================================
   9bis. FILTRI
   ===================================================================== */
function countTrack(tk){
  let n = 0;
  for (const p of M.people){
    for (const q of p.periods.concat(p.shared)) if ((q.tk||q.track) === tk) n++;
    for (const m of p.marks) if (m.tk === tk) n++;
  }
  if (tk === "world") n += M.context.length + M.contextPeriods.length;
  return n;
}
function buildFilters(){
  const box = $("#filters");
  box.textContent = "";
  box.appendChild(el("h4",null,"Cosa mostrare"));
  for (const t of TRACKS){
    const n = countTrack(t.k);
    const lab = el("label", n ? "" : "off");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = FILT.has(t.k); cb.disabled = !n;
    cb.onchange = () => { cb.checked ? FILT.add(t.k) : FILT.delete(t.k); saveFilters(); draw(); };
    lab.appendChild(cb);
    lab.appendChild(el("span",null,t.l));
    lab.appendChild(el("span","fcount", n ? String(n) : "—"));
    box.appendChild(lab);
  }
  const btns = el("div","fbtns");
  const all = el("button","btn","Tutto");
  all.onclick = () => { for (const t of TRACKS) FILT.add(t.k); saveFilters(); buildFilters(); draw(); };
  const none = el("button","btn","Niente");
  none.onclick = () => { FILT.clear(); saveFilters(); buildFilters(); draw(); };
  btns.appendChild(all); btns.appendChild(none);
  box.appendChild(btns);
  const off = TRACKS.filter(t=>!FILT.has(t.k)).length;
  $("#btnFilt").textContent = off ? "Filtri · " + (TRACKS.length-off) + "/" + TRACKS.length : "Filtri";
  $("#btnFilt").classList.toggle("on", off > 0);
}

/* =====================================================================
   9ter. PERSISTENZA
   Prima `window.storage` (quando c'e'), poi localStorage. Se non e'
   disponibile nessuno dei due il resto dell'app funziona lo stesso:
   restano scarica e apri file.
   ===================================================================== */
const KEY = "prospettiva:data", KEYF = "prospettiva:filtri";
const Store = {
  mode: null,
  async init(){
    try {
      if (typeof window !== "undefined" && window.storage && window.storage.set){
        await window.storage.set("prospettiva:ping", "1");
        this.mode = "app"; return;
      }
    } catch(e){}
    try {
      localStorage.setItem("prospettiva:ping","1");
      localStorage.removeItem("prospettiva:ping");
      this.mode = "local"; return;
    } catch(e){}
    this.mode = "none";
  },
  async get(k){
    try {
      if (this.mode === "app"){ const r = await window.storage.get(k); return r ? r.value : null; }
      if (this.mode === "local") return localStorage.getItem(k);
    } catch(e){}
    return null;
  },
  async set(k,v){
    if (this.mode === "app") await window.storage.set(k, v);
    else if (this.mode === "local") localStorage.setItem(k, v);
    else throw new Error("Questo browser non consente il salvataggio locale.");
  },
  async del(k){
    try {
      if (this.mode === "app") await window.storage.delete(k);
      else if (this.mode === "local") localStorage.removeItem(k);
    } catch(e){}
  }
};
function saveFilters(){
  if (Store.mode === "none") return;
  Store.set(KEYF, JSON.stringify([...FILT])).catch(()=>{});
}

/* =====================================================================
   1bis. POSIZIONI NEL TESTO JSON
   Uno scanner minimo che, oltre al valore, registra dove ogni percorso
   comincia e finisce nel sorgente. Serve per portare il cursore sul punto
   esatto quando si clicca una diagnostica.
   ===================================================================== */
function scanJSON(text){
  const pos = new Map();
  let i = 0;
  const ws = () => { while (i < text.length && /\s/.test(text[i])) i++; };
  const str = () => {
    i++;                                   // apice iniziale
    let out = "";
    while (i < text.length && text[i] !== '"'){
      if (text[i] === "\\"){
        const c = text[++i];
        out += c === "n" ? "\n" : c === "t" ? "\t" : c === "u"
             ? String.fromCharCode(parseInt(text.substr(i+1,4),16))
             : c;
        if (c === "u") i += 4;
        i++;
      } else out += text[i++];
    }
    i++;                                   // apice finale
    return out;
  };
  function value(path){
    ws();
    const start = i;
    const c = text[i];
    if (c === "{"){ i++; obj(path); }
    else if (c === "["){ i++; arr(path); }
    else if (c === '"'){ str(); }
    else while (i < text.length && !/[,\]}\s]/.test(text[i])) i++;
    pos.set(path, [start, i]);
  }
  function obj(path){
    ws();
    if (text[i] === "}"){ i++; return; }
    for (;;){
      ws();
      const kStart = i;
      const key = str();
      ws(); i++;                           // due punti
      value(path ? path + "." + key : key);
      pos.set((path ? path + "." + key : key) + "\u0000key", [kStart, i]);
      ws();
      if (text[i] === ","){ i++; continue; }
      if (text[i] === "}"){ i++; return; }
      return;
    }
  }
  function arr(path){
    ws();
    if (text[i] === "]"){ i++; return; }
    let n = 0;
    for (;;){
      value(path + "[" + (n++) + "]");
      ws();
      if (text[i] === ","){ i++; continue; }
      if (text[i] === "]"){ i++; return; }
      return;
    }
  }
  try { value(""); } catch(e){ /* testo malformato: nessuna posizione */ }
  return pos;
}

/* =====================================================================
   1ter. VALIDAZIONE
   Raccoglie TUTTE le diagnostiche invece di fermarsi alla prima.
   Gli errori bloccano il caricamento, gli avvisi no.
   Ogni regola ha un codice stabile, citato nei test e in docs/requisiti.md.
   ===================================================================== */
const REPLACE_KEYS = ["primary","middle","highschool","bachelor","master"];
const DOC_TYPES = ["patente","passaporto","identita"];
const KNOWN_CATEGORIES = ["school","work","home","holiday","finance","doc",
                          "life","family","sport","history"];

function validate(data){
  const D = [];
  // dichiarata qui perché `place()` la usa già durante la scansione delle persone
  const usedPlaces = new Set();
  const err  = (code, path, message, hint) => D.push({level:"error",   code, path, message, hint});
  const warn = (code, path, message, hint) => D.push({level:"warning", code, path, message, hint});

  if (!data || typeof data !== "object" || Array.isArray(data)){
    err("E001", "", "Il documento non è un oggetto JSON.",
        "La radice deve essere { … } con almeno la chiave `people`.");
    return D;
  }

  /* ---------- date ---------- */
  const dcache = new Map();
  function date(v, path, label){
    if (v == null){ return null; }
    const s = String(v).trim();
    const m = /^(-?\d{1,4})(?:-(\d{1,2})(?:-(\d{1,2}))?)?$/.exec(s);
    if (!m){
      err("E005", path, label + ': "' + s + '" non è una data riconoscibile.',
          "Ammessi solo AAAA, AAAA-MM e AAAA-MM-GG, per esempio 1978, 1978-04 o 1978-04-12.");
      return null;
    }
    const y = +m[1], mo = m[2] ? +m[2] : null, d = m[3] ? +m[3] : null;
    if (mo != null && (mo < 1 || mo > 12)){
      err("E006", path, label + ": il mese " + mo + " non esiste.", "I mesi vanno da 01 a 12.");
      return null;
    }
    if (d != null){
      const last = new Date(Date.UTC(y, mo, 0)).getUTCDate();
      if (d < 1 || d > last){
        err("E006", path, label + ": il " + d + " non esiste in quel mese.",
            "Quel mese ha " + last + " giorni.");
        return null;
      }
    }
    if ((m[2] && m[2].length === 1) || (m[3] && m[3].length === 1))
      warn("W010", path, label + ': "' + s + '" non è in forma canonica.',
           "Meglio due cifre per mese e giorno: " + y +
           (mo != null ? "-" + String(mo).padStart(2,"0") : "") +
           (d != null ? "-" + String(d).padStart(2,"0") : "") + ".");
    let dt = dcache.get(s);
    if (!dt){ try { dt = parseDate(s); dcache.set(s, dt); } catch(e){ return null; } }
    return dt;
  }

  /* ---------- settings ---------- */
  const settings = data.settings || {};
  if (settings.ageDisplay && ["midpoint","range"].indexOf(settings.ageDisplay) < 0)
    err("E019", "settings.ageDisplay", 'Valore "' + settings.ageDisplay + '" non ammesso.',
        "Usa `midpoint` (~77 anni) oppure `range` (76–77 anni).");
  const horizon = settings.horizon != null
    ? date(settings.horizon, "settings.horizon", "Orizzonte") : parseDate("2060");
  if (settings.milestones != null && (!Array.isArray(settings.milestones) ||
      settings.milestones.some(n => !Number.isInteger(n) || n <= 0)))
    err("E016", "settings.milestones", "Deve essere una lista di interi positivi.",
        "Per esempio [5, 10, 25, 50].");
  if (settings.filters != null && !Array.isArray(settings.filters))
    err("E021", "settings.filters", "Deve essere una lista di corsie.",
        "Valori ammessi: " + TRACKS.map(t=>t.k).join(", ") + ".");

  /* ---------- people ---------- */
  if (!Array.isArray(data.people)){
    err("E002", "people", "Manca l'elenco delle persone.",
        "Serve `\"people\": [ … ]` con almeno una persona.");
    return D;
  }
  if (!data.people.length)
    err("E002", "people", "L'elenco delle persone è vuoto.",
        "Aggiungi almeno una persona con `name` e `birth`.");

  const ids = new Map(), names = new Map(), births = new Map(), deaths = new Map();
  data.people.forEach((p, i) => {
    const P = "people[" + i + "]";
    if (!p || typeof p !== "object"){
      err("E003", P, "Questa voce non è un oggetto.", "Ogni persona è { \"name\": …, \"birth\": … }.");
      return;
    }
    const who = p.name || p.id || "#" + i;
    if (!p.name) err("E003", P + ".name", "Persona senza nome.", "Serve `name`, per esempio \"Anna\".");
    if (!p.id) warn("W014", P + ".id", who + " non ha un `id`.",
                    "Senza id nessun evento condiviso potrà riferirsi a questa persona con `who`.");
    else if (ids.has(p.id))
      err("E007", P + ".id", 'L\'id "' + p.id + '" è già usato da ' + ids.get(p.id) + ".",
          "Gli id devono essere unici: servono a collegare eventi e periodi condivisi.");
    else ids.set(p.id, who);
    if (p.name){
      if (names.has(p.name))
        warn("W007", P + ".name", "Due persone si chiamano " + p.name + ".",
             "Le colonne della matrice saranno indistinguibili: aggiungi un cognome o un soprannome.");
      names.set(p.name, i);
    }

    if (p.birth == null)
      err("E004", P + ".birth", who + " non ha una data di nascita.",
          "`birth` è obbligatoria: da lì discendono tutte le età.");
    const b = date(p.birth, P + ".birth", "Nascita di " + who);
    if (b) births.set(i, b);
    const dd = p.death != null ? date(p.death, P + ".death", "Morte di " + who) : null;
    if (dd) deaths.set(i, dd);
    if (b && dd && dd.t1 <= b.t0)
      err("E010", P + ".death", who + " risulta morto prima di nascere.",
          "Nascita " + fmtDate(b) + ", morte " + fmtDate(dd) + ".");

    if (p.color != null && !/^#[0-9a-fA-F]{6}$/.test(String(p.color)))
      warn("W009", P + ".color", '"' + p.color + '" non è un colore esadecimale a sei cifre.',
           "Verrà usato un colore della tavolozza. Formato atteso: \"#35407E\".");

    /* scuola */
    if (p.school != null){
      if (typeof p.school !== "object")
        err("E013", P + ".school", "Deve essere un oggetto.", "Per esempio { \"through\": \"highschool\" }.");
      else {
        if (p.school.through != null && REPLACE_KEYS.indexOf(p.school.through) < 0)
          err("E013", P + ".school.through", '"' + p.school.through + '" non è un ciclo noto.',
              "Ammessi: " + REPLACE_KEYS.join(", ") + ".");
        for (const k of Object.keys(p.school.delays || {})){
          if (REPLACE_KEYS.indexOf(k) < 0)
            err("E014", P + ".school.delays." + k, '"' + k + '" non è un ciclo noto.',
                "Ammessi: " + REPLACE_KEYS.join(", ") + ".");
          else if (!Number.isInteger(p.school.delays[k]) || p.school.delays[k] < 0)
            err("E014", P + ".school.delays." + k, "Il ritardo dev'essere un intero non negativo.",
                "Un anno perso alle medie si scrive 1.");
        }
      }
    }

    /* documenti */
    (p.documents || []).forEach((doc, j) => {
      const Q = P + ".documents[" + j + "]";
      if (doc.expires == null)
        err("E017", Q + ".expires", "Documento senza scadenza.",
            "`expires` è obbligatoria: è da lì che si proiettano i rinnovi.");
      const e = date(doc.expires, Q + ".expires", "Scadenza");
      if (doc.type != null && DOC_TYPES.indexOf(doc.type) < 0 && doc.validity == null)
        warn("W016", Q + ".type", '"' + doc.type + '" non ha regole di rinnovo note.',
             "Verrà usata una validità di 10 anni. Ammessi: " + DOC_TYPES.join(", ") +
             ", oppure indica `validity` in anni.");
      if (doc.validity != null && (!Number.isInteger(doc.validity) || doc.validity <= 0))
        err("E018", Q + ".validity", "La validità dev'essere un intero positivo di anni.",
            "Per esempio 4.");
      if (e && b && e.t1 < b.t0)
        err("E009", Q + ".expires", "Il documento scade prima della nascita.",
            "Nascita " + fmtDate(b) + ", scadenza " + fmtDate(e) + ".");
      if (e && e.t1 < todayDec() - 10)
        warn("W008", Q + ".expires", "Scadenza vecchia di oltre dieci anni: " + fmtDate(e) + ".",
             "La catena dei rinnovi partirà da lì e riempirà la corsia di voci passate. " +
             "Di solito conviene indicare la scadenza attuale.");
    });

    (p.periods || []).forEach((q, j) => span(q, P + ".periods[" + j + "]", i));
    (p.events  || []).forEach((e, j) => point(e, P + ".events[" + j + "]", i));
  });

  /* ---------- radice ---------- */
  (data.events   || []).forEach((e, i) => point(e, "events[" + i + "]", null));
  (data.periods  || []).forEach((q, i) => span(q, "periods[" + i + "]", null));
  (data.holidays || []).forEach((q, i) => span(q, "holidays[" + i + "]", null, true));

  if (data.meta && data.meta.anchor && !ids.has(data.meta.anchor))
    err("E020", "meta.anchor", 'Nessuna persona ha l\'id "' + data.meta.anchor + '".',
        ids.size ? "Id disponibili: " + [...ids.keys()].join(", ") + "." : "Dai un `id` a una persona.");

  /* ---------- places ---------- */
  const dict = {};
  if (data.places != null){
    if (typeof data.places !== "object" || Array.isArray(data.places))
      err("E021", "places", "Deve essere un dizionario nome → coordinate.",
          'Per esempio { "Porto Ercole": [42.394, 11.207] }.');
    else for (const [k, v] of Object.entries(data.places)){
      if (!Array.isArray(v) || v.length < 2 || typeof v[0] !== "number" || typeof v[1] !== "number")
        err("E015", "places." + k, "Coordinate non valide.", "Servono due numeri: [latitudine, longitudine].");
      else if (v[0] < -90 || v[0] > 90 || v[1] < -180 || v[1] > 180)
        err("E015", "places." + k, "Coordinate fuori scala: [" + v[0] + ", " + v[1] + "].",
            "Latitudine fra -90 e 90, longitudine fra -180 e 180. Forse sono invertite?");
      else dict[k] = v;
    }
  }
  // `usedPlaces` è completo solo ora: i luoghi si raccolgono scorrendo persone,
  // eventi e periodi, che vengono prima.
  for (const k of Object.keys(dict))
    if (!usedPlaces.has(k))
      warn("W005", "places." + k, '"' + k + '" non è usato da nessun evento o periodo.',
           "Innocuo, ma forse il nome non coincide con quello scritto in `place`.");

  return D;

  /* ---------- helper condivisi ---------- */
  function place(v, path){
    if (v == null) return;
    if (typeof v === "string"){ usedPlaces.add(v); return; }
    if (typeof v !== "object" || !v.name){
      err("E015", path, "Luogo non valido.",
          'Una stringa ("Milano") oppure { "name": …, "coord": [lat, lon] }.');
      return;
    }
    usedPlaces.add(v.name);
    if (v.coord != null){
      if (!Array.isArray(v.coord) || v.coord.length < 2 ||
          typeof v.coord[0] !== "number" || typeof v.coord[1] !== "number")
        err("E015", path + ".coord", "Coordinate non valide.", "Servono due numeri: [latitudine, longitudine].");
      else if (v.coord[0] < -90 || v.coord[0] > 90 || v.coord[1] < -180 || v.coord[1] > 180)
        err("E015", path + ".coord", "Coordinate fuori scala.",
            "Latitudine fra -90 e 90, longitudine fra -180 e 180. Forse sono invertite?");
    }
  }
  function whoRefs(x, path){
    if (x.who == null) return;
    if (!Array.isArray(x.who)){
      err("E021", path + ".who", "Deve essere una lista di id.", 'Per esempio ["me", "laura"].');
      return;
    }
    x.who.forEach((id, k) => {
      if (!ids.has(id))
        err("E008", path + ".who[" + k + "]", 'Nessuna persona ha l\'id "' + id + '".',
            ids.size ? "Id disponibili: " + [...ids.keys()].join(", ") + "." : "Dai un `id` alle persone.");
    });
    // Solo se l'id esiste: altrimenti l'avviso si accavallerebbe all'errore E008.
    if (x.who.length === 1 && ids.has(x.who[0]))
      warn("W004", path + ".who", "Un solo riferimento in `who`.",
           "Se riguarda solo " + ids.get(x.who[0]) +
           ", sta meglio dentro `people[].events` o `people[].periods`.");
  }
  function category(x, path){
    if (x.category != null && KNOWN_CATEGORIES.indexOf(x.category) < 0)
      warn("W006", path + ".category", '"' + x.category + '" non è una categoria nota.',
           "Finirà nella corsia Vita. Note: " + KNOWN_CATEGORIES.join(", ") + ".");
    if (x.track != null && TRACKS.every(t => t.k !== x.track))
      warn("W006", path + ".track", '"' + x.track + '" non è una corsia nota.',
           "Corsie: " + TRACKS.map(t=>t.k).join(", ") + ".");
  }
  function lifeSpan(dt, personIx, path, label){
    if (personIx == null || !dt) return;
    const b = births.get(personIx), dd = deaths.get(personIx);
    if (b && dt.t1 < b.t0)
      warn("W002", path, label + " precede la nascita (" + fmtDate(b) + ").",
           "Non comparirà nella vista Età allineate.");
    if (dd && dt.t0 > dd.t1)
      warn("W002", path, label + " è successivo alla morte (" + fmtDate(dd) + ").",
           "Comparirà comunque sulla cronologia, ma le età risulteranno vuote.");
  }
  function point(e, path, personIx){
    if (!e || typeof e !== "object"){
      err("E011", path, "Questa voce non è un oggetto.", 'Un evento è { "label": …, "date": … }.');
      return;
    }
    if (!e.label) warn("W015", path + ".label", "Evento senza etichetta.", "Comparirà come voce vuota.");
    if (e.date == null)
      err("E011", path + ".date", "Evento senza data.",
          "Un evento è puntuale e usa `date`; per un intervallo usa `start` e `end`.");
    if (e.start != null || e.end != null)
      err("E011", path, "Un evento non può avere `start` o `end`.",
          "Punto nel tempo → `date`. Intervallo → spostalo in `periods` con `start`/`end`.");
    const d = date(e.date, path + ".date", "Data");
    lifeSpan(d, personIx, path + ".date", "L'evento");
    if (d && horizon && d.t0 > horizon.t1)
      warn("W003", path + ".date", "Oltre l'orizzonte (" + fmtDate(horizon) + ").",
           "Non verrà disegnato: alza `settings.horizon`.");
    if (e.recurrences != null && e.recurrences !== true &&
        (!Array.isArray(e.recurrences) || e.recurrences.some(n => !Number.isInteger(n) || n <= 0)))
      err("E016", path + ".recurrences", "Deve essere `true` o una lista di interi positivi.",
          "Per esempio [10, 25, 50], oppure true per usare `settings.milestones`.");
    place(e.place, path + ".place");
    whoRefs(e, path);
    category(e, path);
  }
  function span(q, path, personIx, isHoliday){
    if (!q || typeof q !== "object"){
      err("E011", path, "Questa voce non è un oggetto.", 'Un periodo è { "label": …, "start": … }.');
      return;
    }
    if (!q.label) warn("W015", path + ".label", "Periodo senza etichetta.", "La barra risulterà anonima.");
    if (q.start == null)
      err("E011", path + ".start", "Periodo senza inizio.",
          "`start` è obbligatorio; `end` si può omettere per indicare «ancora in corso».");
    if (q.date != null)
      err("E011", path + ".date", "Un periodo non usa `date`.",
          "Intervallo → `start` e `end`. Punto nel tempo → spostalo in `events`.");
    const s = date(q.start, path + ".start", "Inizio");
    const e = q.end != null ? date(q.end, path + ".end", "Fine") : null;
    if (s && e && e.t1 <= s.t0)
      err("E009", path + ".end", "La fine precede l'inizio.",
          "Inizio " + fmtDate(s) + ", fine " + fmtDate(e) + ".");
    lifeSpan(s, personIx, path + ".start", "Il periodo");
    if (s && horizon && s.t0 > horizon.t1)
      warn("W003", path + ".start", "Oltre l'orizzonte (" + fmtDate(horizon) + ").",
           "Non verrà disegnato: alza `settings.horizon`.");
    if (q.replaces != null && REPLACE_KEYS.indexOf(q.replaces) < 0)
      err("E012", path + ".replaces", '"' + q.replaces + '" non è un ciclo scolastico noto.',
          "Ammessi: " + REPLACE_KEYS.join(", ") + ".");
    if (q.replaces != null && personIx != null && !(data.people[personIx] || {}).school)
      warn("W011", path + ".replaces", "Non c'è nulla da sostituire.",
           "`replaces` ha effetto solo se la persona ha un blocco `school`.");
    if (isHoliday && s && e && (e.mid - s.mid) > 0.5)
      warn("W012", path, "Vacanza di oltre sei mesi.",
           "Se è un trasferimento, sta meglio come periodo con `track` `home` o `work`.");
    place(q.place, path + ".place");
    whoRefs(q, path);
    category(q, path);
  }
}


/* =====================================================================
   9quater. DIAGNOSTICA NEL PANNELLO DATI
   ===================================================================== */
let DIAGS = [];

function jumpTo(path){
  const ta = $("#json");
  const pos = scanJSON(ta.value);
  let p = path;
  let at = pos.get(p + "\u0000key") || pos.get(p);
  while (!at && p.indexOf(".") + p.indexOf("[") > -2){     // risali al genitore
    p = p.replace(/\.[^.\[]+$|\[\d+\]$/, "");
    at = pos.get(p + "\u0000key") || pos.get(p);
  }
  if (!at) return;
  ta.focus();
  ta.setSelectionRange(at[0], at[1]);
  // porta la selezione in vista: nessun scrollIntoView per le textarea
  const before = ta.value.slice(0, at[0]).split("\n").length;
  const lineH = ta.scrollHeight / Math.max(1, ta.value.split("\n").length);
  ta.scrollTop = Math.max(0, (before - 4) * lineH);
}

function renderDiags(list, okMessage){
  DIAGS = list;
  const box = $("#diags");
  box.textContent = "";
  const errors = list.filter(d => d.level === "error");
  const warns  = list.filter(d => d.level === "warning");

  if (!list.length){
    box.classList.remove("on");
    $("#btnData").classList.remove("warn");
    $("#btnData").textContent = "Dati";
    if (okMessage) { $("#msg").className = ""; $("#msg").textContent = okMessage; }
    return;
  }
  box.classList.add("on");
  const head = el("div","hd",
    (errors.length ? errors.length + (errors.length === 1 ? " errore" : " errori") : "") +
    (errors.length && warns.length ? " · " : "") +
    (warns.length ? warns.length + (warns.length === 1 ? " avviso" : " avvisi") : "") +
    (errors.length ? " — i dati non sono stati caricati" : " — dati caricati"));
  box.appendChild(head);

  for (const d of errors.concat(warns)){
    const row = el("div","dg " + d.level);
    row.appendChild(el("div","lv", d.level === "error" ? d.code : d.code));
    row.appendChild(el("div","ms", d.message));
    if (d.path) row.appendChild(el("div","pt", d.path));
    if (d.hint) row.appendChild(el("div","hn", d.hint));
    row.onclick = () => jumpTo(d.path);
    box.appendChild(row);
  }
  $("#btnData").textContent = "Dati · " + (errors.length || warns.length);
  $("#btnData").classList.toggle("warn", errors.length > 0);
}

/* Restituisce i dati se sono utilizzabili, altrimenti null. */
function readJSON(showOk){
  const text = $("#json").value;
  let data;
  try {
    data = JSON.parse(text);
  } catch(e){
    const m = /position (\d+)/.exec(e.message);
    const at = m ? +m[1] : null;
    const line = at != null ? text.slice(0, at).split("\n").length : null;
    renderDiags([{
      level: "error", code: "E000", path: "",
      message: "Il testo non è JSON valido" + (line ? " (riga " + line + ")" : "") + ".",
      hint: e.message
    }]);
    if (at != null){ $("#json").focus(); $("#json").setSelectionRange(at, at + 1); }
    return null;
  }
  const diags = validate(data);
  renderDiags(diags, showOk);
  return diags.some(d => d.level === "error") ? null : data;
}

/* =====================================================================
   9. APP
   ===================================================================== */
function draw(){
  if (VIEW === "chart") renderChart($("#pane-chart"), false);
  else if (VIEW === "ages") renderChart($("#pane-ages"), true);
  else if (VIEW === "places") renderPlaces($("#pane-places"));
  else if (VIEW === "dense") renderDense($("#pane-dense"));
  else renderMatrix($("#pane-matrix"));
}
function setView(v){
  VIEW = v;
  for (const b of document.querySelectorAll("nav.views button"))
    b.setAttribute("aria-selected", String(b.dataset.view === v));
  for (const p of document.querySelectorAll(".pane")) p.classList.remove("on");
  $("#pane-"+v).classList.add("on");
  const chartish = (v === "chart" || v === "ages");
  $("#zoom").disabled = !chartish;
  $("#legend").classList.toggle("on", chartish);
  document.documentElement.style.setProperty("--headh", $("#head").offsetHeight + "px");
  draw();
  if (v === "chart") scrollToNow();
}
function scrollToNow(){
  const pane = $("#pane-chart");
  const x = (M.now - M.span.lo) * PPY;
  pane.scrollLeft = Math.max(0, x - pane.clientWidth * 0.62);
}
function load(data, keepFilters){
  const prev = FILT;
  FILT = null;
  M = build(data);
  FILT = keepFilters && prev ? prev
       : new Set((M.settings.filters) || TRACKS.map(t=>t.k).filter(k=>DEFAULT_OFF.indexOf(k)<0));
  buildFilters();
  document.title = M.title + " — carta del tempo";
  const a = M.anchor;
  const at = ageText(a, {t0:M.now,t1:M.now,mid:M.now}, M.settings.ageDisplay);
  $("#anchorline").textContent = a.name + " · " + at.txt + " · oggi " + fmtDate(parseDate(new Date().toISOString().slice(0,10)));
  draw();
  if (VIEW === "chart") requestAnimationFrame(scrollToNow);
}

async function restore(){
  await Store.init();
  if (Store.mode === "none"){
    $("#btnSave").disabled = true; $("#btnForget").disabled = true;
    $("#btnSave").title = "Salvataggio non disponibile in questo contesto";
    return;
  }
  const f = await Store.get(KEYF);
  const d = await Store.get(KEY);
  if (d){
    try {
      const parsed = JSON.parse(d);
      $("#json").value = d;
      const diags = validate(parsed);
      if (diags.some(x => x.level === "error")){
        renderDiags(diags);
        $("#msg").className = "err";
        $("#msg").textContent = "La copia salvata contiene errori: mostro l'esempio.";
        return;
      }
      renderDiags(diags);
      load(parsed);
      if (f) { try { FILT = new Set(JSON.parse(f)); buildFilters(); draw(); } catch(e){} }
      $("#msg").textContent = "Caricata la copia salvata nel browser.";
      return;
    } catch(e){ $("#msg").className = "err"; $("#msg").textContent = "Copia salvata illeggibile, uso l'esempio."; }
  }
  if (f) { try { FILT = new Set(JSON.parse(f)); buildFilters(); draw(); } catch(e){} }
}

function boot(){
  const setH = () => document.documentElement.style.setProperty("--headh", $("#head").offsetHeight + "px");
  setH(); addEventListener("resize", setH);

  $("#json").value = JSON.stringify(SAMPLE, null, 2);
  try { load(SAMPLE); } catch(e){ console.error(e); }

  const filtBox = $("#filters");
  const placeFilt = () => {
    filtBox.style.top = ($("#head").offsetHeight - 6) + "px";
  };
  $("#btnFilt").onclick = e => { e.stopPropagation(); placeFilt(); filtBox.classList.toggle("on"); };
  document.addEventListener("click", e => {
    if (!filtBox.contains(e.target) && e.target !== $("#btnFilt")) filtBox.classList.remove("on");
  });

  restore();

  for (const b of document.querySelectorAll("nav.views button"))
    b.onclick = () => setView(b.dataset.view);

  $("#zoom").oninput = e => {
    const pane = VIEW==="ages" ? $("#pane-ages") : $("#pane-chart");
    const mid = (pane.scrollLeft + pane.clientWidth/2) / PPY;
    PPY = +e.target.value;
    draw();
    pane.scrollLeft = Math.max(0, mid*PPY - pane.clientWidth/2);
  };
  $("#btnNow").onclick = () => { if (VIEW!=="chart") setView("chart"); else scrollToNow(); };

  const drawer = $("#drawer");
  $("#btnData").onclick = () => { drawer.classList.toggle("on"); $("#btnData").classList.toggle("on"); };
  $("#btnClose").onclick = () => { drawer.classList.remove("on"); $("#btnData").classList.remove("on"); };
  $("#btnApply").onclick = () => {
    const msg = $("#msg"); msg.className = "";
    const d = readJSON();
    if (!d){ msg.className = "err"; msg.textContent = "Correggi gli errori elencati qui sopra."; return; }
    try {
      load(d);
      const warns = DIAGS.length;
      msg.textContent = "Applicato: " + d.people.length +
        (d.people.length === 1 ? " persona" : " persone") +
        (warns ? " · " + warns + (warns === 1 ? " avviso" : " avvisi") : "");
      if (!warns){ drawer.classList.remove("on"); $("#btnData").classList.remove("on"); }
    } catch(e){
      // rete di sicurezza: se una regola sfugge al validatore lo si vede qui
      renderDiags([{level:"error", code:"E999", path:"",
                    message:"Errore imprevisto durante il caricamento.", hint:e.message}]);
      msg.className = "err"; msg.textContent = e.message;
    }
  };
  $("#btnCheck").onclick = () => { readJSON("Nessun problema rilevato."); };
  const say = (t, err) => { const m = $("#msg"); m.className = err ? "err" : ""; m.textContent = t; };
  $("#btnSave").onclick = async () => {
    try {
      if (!readJSON()) { say("Non salvo dati con errori: correggili prima.", true); return; }
      await Store.set(KEY, $("#json").value);
      await Store.set(KEYF, JSON.stringify([...FILT]));
      say("Salvato nel browser · " + new Date().toLocaleString("it-IT"));
    } catch(e){ say(e.message, true); }
  };
  $("#btnForget").onclick = async () => {
    await Store.del(KEY); await Store.del(KEYF);
    say("Copia salvata rimossa. Il file resta quello che hai scaricato.");
  };
  $("#btnReset").onclick = () => { $("#json").value = JSON.stringify(SAMPLE,null,2); $("#msg").textContent = "Esempio ricaricato. Premi Applica."; };
  $("#btnDownload").onclick = () => {
    const blob = new Blob([$("#json").value], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "prospettiva.json";
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  };
  $("#btnUpload").onclick = () => $("#file").click();
  $("#file").onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { $("#json").value = r.result; $("#btnApply").click(); };
    r.readAsText(f);
  };
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();

if (typeof module !== "undefined") module.exports = {parseDate, build, validate, scanJSON, docValidity, generateDocs, TRACKS, evTrack, ageRange, ageShort, generateSchool, distText, SAMPLE, shiftYears, resolvePlace, decodeLines, collectPlaces, merc, GAZ};
</script>
